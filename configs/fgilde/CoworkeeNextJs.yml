# Generated by scripts/build-collection.mjs from AspireUI's container catalogue.
# Edit by hand only if you also remove this file from configs/GENERATED.
#
# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Coworkee
repository: fgilde/CoworkeeNextJs
description: >-
  Coworkee — the self-hosted HR platform for a whole team: employees with org chart, absence
  and leave with an approval workflow, time tracking, documents, onboarding checklists,
  performance reviews, analytics, a recruiting pipeline and announcements. Nine modules in one
  app, German and English, light and dark, role-based permissions (RBAC), GDPR-friendly
  because it stays on your own server. A setup wizard creates the admin account on first visit
  — or set DEMO to 1 to seed demo data and show the demo logins. Starts the official image
  (ghcr.io/fgilde/coworkeenextjs:latest); nothing is stored, so stopping the run leaves
  nothing behind.
docs: 'https://coworkee.de'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-coworkee-net
    continueOnError: true

tasks:
  - name: db
    run: docker run --rm --name quickrun-coworkee-db --network quickrun-coworkee-net -e POSTGRES_USER=coworkee -e POSTGRES_PASSWORD=coworkee -e POSTGRES_DB=coworkee postgres:16
    readyWhen: {log: database system is ready to accept connections}
  - name: coworkee
    run: docker run --rm --name quickrun-coworkee --network quickrun-coworkee-net -p 3000:3000 -e NODE_ENV=production -e AUTH_TRUST_HOST=true -e DATABASE_URL="postgresql://coworkee:coworkee@quickrun-coworkee-db:5432/coworkee?schema=public" ghcr.io/fgilde/coworkeenextjs:latest
    dependsOn: [db]
    readyWhen: {http: 'http://localhost:3000'}
    open: true

stop:
  - run: docker rm -f quickrun-coworkee-db
    continueOnError: true
  - run: docker rm -f quickrun-coworkee
    continueOnError: true
  - run: docker network rm quickrun-coworkee-net
    continueOnError: true
