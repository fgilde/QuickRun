version: 1
name: Radarr
repository: Radarr/Radarr
description: >-
  Movie organizer/manager for usenet and torrent users. ... Radarr is a movie collection
  manager for Usenet and BitTorrent users. It can monitor multiple RSS feeds for new movies
  and will interface with clients and indexers to grab, sort, and rename them. It can also be
  configured to automatically upgrade the quality of existing files in the library when a
  better quality format becomes available. Starts the official image
  (lscr.io/linuxserver/radarr:latest); nothing is stored, so stopping the run leaves nothing
  behind.
docs: 'https://radarr.video'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-radarr-net
    continueOnError: true

tasks:
  - name: radarr
    run: docker run --rm --name quickrun-radarr --network quickrun-radarr-net -p 7878:7878 lscr.io/linuxserver/radarr:latest
    readyWhen: {http: 'http://localhost:7878'}
    open: true

stop:
  - run: docker rm -f quickrun-radarr
    continueOnError: true
  - run: docker network rm quickrun-radarr-net
    continueOnError: true
