# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Grafana
repository: grafana/grafana
description: >-
  The open and composable observability and data visualization platform. Visualize metrics,
  logs, and traces from multiple sources like Prometheus, Loki, Elasticsearch, InfluxDB,
  Postgres and many more. Grafana — dashboards & visualization over your metrics/logs (login
  admin / admin). Starts the official image (grafana/grafana:latest); nothing is stored, so
  stopping the run leaves nothing behind.
docs: 'https://grafana.com'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-grafana-net
    continueOnError: true

tasks:
  - name: grafana
    run: docker run --rm --name quickrun-grafana --network quickrun-grafana-net -p 3000:3000 grafana/grafana:latest
    readyWhen: {http: 'http://localhost:3000'}
    open: true

stop:
  - run: docker rm -f quickrun-grafana
    continueOnError: true
  - run: docker network rm quickrun-grafana-net
    continueOnError: true
