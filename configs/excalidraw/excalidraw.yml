version: 1
name: Excalidraw
repository: excalidraw/excalidraw
description: >-
  Virtual whiteboard for sketching hand-drawn like diagrams Starts the official image
  (excalidraw/excalidraw:latest); nothing is stored, so stopping the run leaves nothing
  behind.
docs: 'https://excalidraw.com'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-excalidraw-net
    continueOnError: true

tasks:
  - name: excalidraw
    run: docker run --rm --name quickrun-excalidraw --network quickrun-excalidraw-net -p 80:80 excalidraw/excalidraw:latest
    readyWhen: {http: 'http://localhost:80'}
    open: true

stop:
  - run: docker rm -f quickrun-excalidraw
    continueOnError: true
  - run: docker network rm quickrun-excalidraw-net
    continueOnError: true
