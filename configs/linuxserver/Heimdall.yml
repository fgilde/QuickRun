# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Heimdall
repository: linuxserver/Heimdall
description: >-
  An Application dashboard and launcher Starts the official image
  (lscr.io/linuxserver/heimdall:latest); nothing is stored, so stopping the run leaves nothing
  behind.
docs: 'https://heimdall.site'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-heimdall-net
    continueOnError: true

tasks:
  - name: heimdall
    run: docker run --rm --name quickrun-heimdall --network quickrun-heimdall-net -p 80:80 lscr.io/linuxserver/heimdall:latest
    readyWhen: {http: 'http://localhost:80'}
    open: true

stop:
  - run: docker rm -f quickrun-heimdall
    continueOnError: true
  - run: docker network rm quickrun-heimdall-net
    continueOnError: true
