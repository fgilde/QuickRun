version: 1
name: Prowlarr
repository: Prowlarr/Prowlarr
description: >-
  Prowlarr is an indexer manager/proxy built on the popular *arr .net/reactjs base stack to
  integrate with your various PVR apps, supporting management of both Torrent Trackers and
  Usenet Indexers. ... Prowlarr is an indexer manager/proxy built on the popular \*arr
  .net/reactjs base stack to integrate with your various PVR apps. Prowlarr supports
  management of both Torrent Trackers and Usenet Indexers. It integrates… Starts the official
  image (lscr.io/linuxserver/prowlarr:latest); nothing is stored, so stopping the run leaves
  nothing behind.
docs: 'https://prowlarr.com'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-prowlarr-net
    continueOnError: true

tasks:
  - name: prowlarr
    run: docker run --rm --name quickrun-prowlarr --network quickrun-prowlarr-net -p 9696:9696 lscr.io/linuxserver/prowlarr:latest
    readyWhen: {http: 'http://localhost:9696'}
    open: true

stop:
  - run: docker rm -f quickrun-prowlarr
    continueOnError: true
  - run: docker network rm quickrun-prowlarr-net
    continueOnError: true
