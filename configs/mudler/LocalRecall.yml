# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: LocalRecall
repository: mudler/LocalRecall
description: >-
  LocalRecall — local RAG / long-term memory server (mudler, pairs with LocalAI). Starts the
  official image (quay.io/mudler/localrecall:latest); nothing is stored, so stopping the run
  leaves nothing behind.
docs: 'https://github.com/mudler/LocalRecall'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-localrecall-net
    continueOnError: true

tasks:
  - name: localrecall
    run: docker run --rm --name quickrun-localrecall --network quickrun-localrecall-net -p 8080:8080 quay.io/mudler/localrecall:latest
    readyWhen: {http: 'http://localhost:8080'}
    open: true

stop:
  - run: docker rm -f quickrun-localrecall
    continueOnError: true
  - run: docker network rm quickrun-localrecall-net
    continueOnError: true
