# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Nginx Proxy Manager
repository: jc21/nginx-proxy-manager
description: >-
  Nginx Proxy Manager — reverse proxy + Let's Encrypt with a friendly UI (admin on :81;
  proxies 80/443). Default login admin@example.com / changeme. Needs /data + /etc/letsencrypt
  volumes or it refuses to start. Starts the official image (jc21/nginx-proxy-manager:latest);
  nothing is stored, so stopping the run leaves nothing behind.
docs: 'https://nginxproxymanager.com'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-npm-net
    continueOnError: true

tasks:
  - name: npm
    run: docker run --rm --name quickrun-npm --network quickrun-npm-net -p 81:81 jc21/nginx-proxy-manager:latest
    readyWhen: {http: 'http://localhost:81'}
    open: true

stop:
  - run: docker rm -f quickrun-npm
    continueOnError: true
  - run: docker network rm quickrun-npm-net
    continueOnError: true
