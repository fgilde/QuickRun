version: 1
name: PhotoPrism
repository: photoprism/photoprism
description: >-
  PhotoPrism® Pro provides your organization with access to additional configuration and
  deployment options — all fully GDPR-compliant, hosted on your own infrastructure, and backed
  by our team. ... Our mission is to provide the most user- and privacy-friendly solution to
  keep your pictures organized and accessible. That’s why PhotoPrism was built from the ground
  up to run wherever you need it, without compromising… Starts the official image
  (photoprism/photoprism:latest); nothing is stored, so stopping the run leaves nothing
  behind.
docs: 'https://www.photoprism.app'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-photoprism-net
    continueOnError: true

tasks:
  - name: photoprism
    run: docker run --rm --name quickrun-photoprism --network quickrun-photoprism-net -p 2342:2342 photoprism/photoprism:latest
    readyWhen: {http: 'http://localhost:2342'}
    open: true

stop:
  - run: docker rm -f quickrun-photoprism
    continueOnError: true
  - run: docker network rm quickrun-photoprism-net
    continueOnError: true
