version: 1
name: Portainer
repository: portainer/portainer
description: >-
  **Portainer Community Edition** is a lightweight service delivery platform for containerized
  applications that can be used to manage Docker, Swarm, Kubernetes and ACI environments. It
  is designed to be as simple to deploy as it is to use. The application allows you to manage
  all your orchestrator resources (containers, images, volumes, networks and more) through a
  ‘smart’ GUI and/or an extensive API. ... Portainer… Starts the official image
  (portainer/portainer-ce:latest); nothing is stored, so stopping the run leaves nothing
  behind.
docs: 'https://www.portainer.io'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-portainer-net
    continueOnError: true

tasks:
  - name: portainer
    run: docker run --rm --name quickrun-portainer --network quickrun-portainer-net -p 9000:9000 portainer/portainer-ce:latest
    readyWhen: {http: 'http://localhost:9000'}
    open: true

stop:
  - run: docker rm -f quickrun-portainer
    continueOnError: true
  - run: docker network rm quickrun-portainer-net
    continueOnError: true
