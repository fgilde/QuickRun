# Edit by hand only if you also remove this file from configs/GENERATED.
#
# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Outline
repository: outline/outline
description: >-
  # Hosting Outline ... This guide contains documentation for installing and configuring the
  Outline knowledge base in a variety of environments. There is a separate guide that on how
  to use Outline for general documentation of Outline's features. ... While we've done our
  best to make this as easy as possible, however please note that Outline is engineered as a
  horizontally scalable cloud platform and requires… Starts the official image
  (docker.getoutline.com/outlinewiki/outline:latest); nothing is stored, so stopping the run
  leaves nothing behind.
docs: 'https://www.getoutline.com'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-outline-net
    continueOnError: true

tasks:
  - name: db
    run: docker run --rm --name quickrun-outline-db --network quickrun-outline-net -e POSTGRES_DB="outline" -e POSTGRES_USER="outline" -e POSTGRES_PASSWORD="outline" postgres:16
    readyWhen: {log: database system is ready to accept connections}
  - name: redis
    run: docker run --rm --name quickrun-outline-redis --network quickrun-outline-net -p 6379:6379 redis:7
    readyWhen: {log: Ready to accept connections}
  - name: outline
    run: docker run --rm --name quickrun-outline --network quickrun-outline-net -p 3000:3000 -e NODE_ENV="production" -e DATABASE_URL="postgres://outline:outline@quickrun-outline-db:5432/outline" -e PGSSLMODE="disable" -e REDIS_URL="redis://quickrun-outline-redis:6379" -e FORCE_HTTPS="false" docker.getoutline.com/outlinewiki/outline:latest
    dependsOn: [db, redis]
    readyWhen: {http: 'http://localhost:3000'}
    open: true

stop:
  - run: docker rm -f quickrun-outline-db
    continueOnError: true
  - run: docker rm -f quickrun-outline-redis
    continueOnError: true
  - run: docker rm -f quickrun-outline
    continueOnError: true
  - run: docker network rm quickrun-outline-net
    continueOnError: true
