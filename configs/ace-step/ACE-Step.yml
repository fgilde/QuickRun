# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: 'ACE-Step (music)'
repository: ace-step/ACE-Step
description: >-
  ACE-Step: A Step Towards Music Generation Foundation Model GPU recommended. Starts the
  official image (ghcr.io/dotnetautor/ace-step-1.5-docker:latest); nothing is stored, so
  stopping the run leaves nothing behind.
docs: 'https://github.com/ace-step/ACE-Step'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-acestep-net
    continueOnError: true

tasks:
  - name: acestep
    run: docker run --rm --name quickrun-acestep --network quickrun-acestep-net -p 7860:7860 ghcr.io/dotnetautor/ace-step-1.5-docker:latest
    readyWhen: {http: 'http://localhost:7860'}
    open: true

stop:
  - run: docker rm -f quickrun-acestep
    continueOnError: true
  - run: docker network rm quickrun-acestep-net
    continueOnError: true
