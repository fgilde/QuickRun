# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: NocoDB
repository: nocodb/nocodb
description: >-
  NocoDB — turn any database into a smart spreadsheet (Airtable-style). SQLite by default, no
  DB setup needed. Starts the official image (nocodb/nocodb:latest); nothing is stored, so
  stopping the run leaves nothing behind.
docs: 'https://nocodb.com'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-nocodb-net
    continueOnError: true

tasks:
  - name: nocodb
    run: docker run --rm --name quickrun-nocodb --network quickrun-nocodb-net -p 8080:8080 nocodb/nocodb:latest
    readyWhen: {http: 'http://localhost:8080'}
    open: true

stop:
  - run: docker rm -f quickrun-nocodb
    continueOnError: true
  - run: docker network rm quickrun-nocodb-net
    continueOnError: true
