# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: MeTube
repository: alexta69/metube
description: >-
  MeTube — self-hosted web UI for yt-dlp; download video/audio from YouTube and hundreds of
  sites. Starts the official image (ghcr.io/alexta69/metube:latest); nothing is stored, so
  stopping the run leaves nothing behind.
docs: 'https://github.com/alexta69/metube'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-metube-net
    continueOnError: true

tasks:
  - name: metube
    run: docker run --rm --name quickrun-metube --network quickrun-metube-net -p 8081:8081 ghcr.io/alexta69/metube:latest
    readyWhen: {http: 'http://localhost:8081'}
    open: true

stop:
  - run: docker rm -f quickrun-metube
    continueOnError: true
  - run: docker network rm quickrun-metube-net
    continueOnError: true
