# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Fulcrum
repository: cculian/Fulcrum
description: >-
  Fulcrum — fast SPV/Electrum server for BTC/BCH/LTC. Requires an external Bitcoin Core node
  with RPC + txindex; configure via a mounted fulcrum.conf. SSL on 50002. Starts the official
  image (cculianu/fulcrum:latest); nothing is stored, so stopping the run leaves nothing
  behind.
docs: 'https://github.com/cculianu/Fulcrum'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-fulcrum-net
    continueOnError: true

tasks:
  - name: fulcrum
    run: docker run --rm --name quickrun-fulcrum --network quickrun-fulcrum-net -p 50001:50001 cculianu/fulcrum:latest
    readyWhen: {http: 'http://localhost:50001'}
    open: true

stop:
  - run: docker rm -f quickrun-fulcrum
    continueOnError: true
  - run: docker network rm quickrun-fulcrum-net
    continueOnError: true
