# Edit by hand only if you also remove this file from configs/GENERATED.
#
# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Mattermost
repository: mattermost/mattermost
description: >-
  Mattermost — self-hosted team chat (Slack alternative). Postgres companion. Create the admin
  account on first run. Starts the official image (mattermost/mattermost-team-edition:latest);
  nothing is stored, so stopping the run leaves nothing behind.
docs: 'https://mattermost.com'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-mattermost-net
    continueOnError: true

tasks:
  - name: db
    run: docker run --rm --name quickrun-mattermost-db --network quickrun-mattermost-net -e POSTGRES_DB="mattermost" -e POSTGRES_USER="mmuser" -e POSTGRES_PASSWORD="mmuser" postgres:16
    readyWhen: {log: database system is ready to accept connections}
  - name: mattermost
    run: docker run --rm --name quickrun-mattermost --network quickrun-mattermost-net -p 8065:8065 -e MM_SQLSETTINGS_DRIVERNAME="postgres" -e MM_SQLSETTINGS_DATASOURCE="postgres://mmuser:mmuser@quickrun-mattermost-db:5432/mattermost?sslmode=disable&connect_timeout=10" mattermost/mattermost-team-edition:latest
    dependsOn: [db]
    readyWhen: {http: 'http://localhost:8065'}
    open: true

stop:
  - run: docker rm -f quickrun-mattermost-db
    continueOnError: true
  - run: docker rm -f quickrun-mattermost
    continueOnError: true
  - run: docker network rm quickrun-mattermost-net
    continueOnError: true
