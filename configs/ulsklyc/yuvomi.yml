# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Yuvomi
repository: ulsklyc/yuvomi
description: >-
  Yuvomi — self-hosted family planner as a fast PWA: shared calendar (CalDAV/Google/ICS sync),
  tasks, shopping lists, meal planner, contacts, budget and housekeeping. Create the first
  household in the browser after install. Starts the official image
  (ghcr.io/ulsklyc/yuvomi:latest); nothing is stored, so stopping the run leaves nothing
  behind.
docs: 'https://github.com/ulsklyc/yuvomi'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-yuvomi-net
    continueOnError: true

tasks:
  - name: yuvomi
    run: docker run --rm --name quickrun-yuvomi --network quickrun-yuvomi-net -p 3000:3000 -e NODE_ENV="production" -e PORT="3000" -e DB_PATH="/data/yuvomi.db" -e BACKUP_DIR="/backups" -e SESSION_SECURE="false" ghcr.io/ulsklyc/yuvomi:latest
    readyWhen: {http: 'http://localhost:3000'}
    open: true

stop:
  - run: docker rm -f quickrun-yuvomi
    continueOnError: true
  - run: docker network rm quickrun-yuvomi-net
    continueOnError: true
