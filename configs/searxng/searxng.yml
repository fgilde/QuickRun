version: 1
name: SearXNG
repository: searxng/searxng
description: >-
  Search without being tracked. ... SearXNG is a free internet metasearch engine which
  aggregates results from up to 279 search services. Users are neither tracked nor profiled.
  Additionally, SearXNG can be used over Tor for online anonymity. ... Get started with
  SearXNG by using one of the instances listed at searx.space. If you don’t trust anyone, you
  can set up your own, see Installation. Starts the official image (searxng/searxng:latest);
  nothing is stored, so stopping the run leaves nothing behind.
docs: 'https://docs.searxng.org'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-searxng-net
    continueOnError: true

tasks:
  - name: searxng
    run: docker run --rm --name quickrun-searxng --network quickrun-searxng-net -p 8080:8080 searxng/searxng:latest
    readyWhen: {http: 'http://localhost:8080'}
    open: true

stop:
  - run: docker rm -f quickrun-searxng
    continueOnError: true
  - run: docker network rm quickrun-searxng-net
    continueOnError: true
