# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: FreshRSS
repository: FreshRSS/FreshRSS
description: >-
  A free, self-hostable news aggregator… Starts the official image (freshrss/freshrss:latest);
  nothing is stored, so stopping the run leaves nothing behind.
docs: 'https://freshrss.org'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-freshrss-net
    continueOnError: true

tasks:
  - name: freshrss
    run: docker run --rm --name quickrun-freshrss --network quickrun-freshrss-net -p 80:80 freshrss/freshrss:latest
    readyWhen: {http: 'http://localhost:80'}
    open: true

stop:
  - run: docker rm -f quickrun-freshrss
    continueOnError: true
  - run: docker network rm quickrun-freshrss-net
    continueOnError: true
