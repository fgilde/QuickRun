version: 1
name: Core Lightning
repository: ElementsProject/lightning
description: >-
  Core Lightning — Lightning Network implementation focusing on spec compliance and
  performance Starts the official image (elementsproject/lightningd:latest); nothing is
  stored, so stopping the run leaves nothing behind.
docs: 'https://github.com/ElementsProject/lightning'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-core-lightning-net
    continueOnError: true

tasks:
  - name: core-lightning
    run: docker run --rm --name quickrun-core-lightning --network quickrun-core-lightning-net -p 9735:9735 elementsproject/lightningd:latest
    readyWhen: {http: 'http://localhost:9735'}
    open: true

stop:
  - run: docker rm -f quickrun-core-lightning
    continueOnError: true
  - run: docker network rm quickrun-core-lightning-net
    continueOnError: true
