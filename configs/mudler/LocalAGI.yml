# Generated by scripts/build-collection.mjs from AspireUI's container catalogue.
# Edit by hand only if you also remove this file from configs/GENERATED.
#
# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: LocalAGI
repository: mudler/LocalAGI
description: >-
  LocalAGI — self-hostable AI agent platform (mudler). Comes with a LocalAI companion; set
  LOCALAGI_MODEL to a model your LocalAI has pulled (scaffold — provide/pull the model).
  Starts the official image (quay.io/mudler/localagi:latest); nothing is stored, so stopping
  the run leaves nothing behind.
docs: 'https://github.com/mudler/LocalAGI'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-localagi-net
    continueOnError: true

tasks:
  - name: llm
    run: docker run --rm --name quickrun-localagi-llm --network quickrun-localagi-net -p 8080:8080 localai/localai:latest
    readyWhen: {port: 8080}
  - name: localagi
    run: docker run --rm --name quickrun-localagi --network quickrun-localagi-net -p 3000:3000 -e LOCALAGI_MODEL=gpt-4 -e LOCALAGI_LLM_API_URL=http://quickrun-localagi-llm:8080 quay.io/mudler/localagi:latest
    dependsOn: [llm]
    readyWhen: {http: 'http://localhost:3000'}
    open: true

stop:
  - run: docker rm -f quickrun-localagi-llm
    continueOnError: true
  - run: docker rm -f quickrun-localagi
    continueOnError: true
  - run: docker network rm quickrun-localagi-net
    continueOnError: true
