version: 1
name: Whoogle
repository: benbusby/whoogle-search
description: >-
  Whoogle — private, ad-free Google search proxy (no JS, no tracking). Starts the official
  image (benbusby/whoogle-search:latest); nothing is stored, so stopping the run leaves
  nothing behind.
docs: 'https://github.com/benbusby/whoogle-search'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-whoogle-net
    continueOnError: true

tasks:
  - name: whoogle
    run: docker run --rm --name quickrun-whoogle --network quickrun-whoogle-net -p 5000:5000 benbusby/whoogle-search:latest
    readyWhen: {http: 'http://localhost:5000'}
    open: true

stop:
  - run: docker rm -f quickrun-whoogle
    continueOnError: true
  - run: docker network rm quickrun-whoogle-net
    continueOnError: true
