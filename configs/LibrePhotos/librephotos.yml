# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: LibrePhotos
repository: LibrePhotos/librephotos
description: >-
  GitHub - LibrePhotos/librephotos: A self-hosted open source photo management service. ·
  GitHub ... A self-hosted, open-source photo management service with automatic face
  recognition, object detection, and semantic search — powered by modern machine learning. ...
  A self-hosted open source photo management service. Admin from params (admin /
  please-change-me). Starts the official image (reallibrephotos/librephotos-unified:latest);
  nothing is stored, so stopping the run leaves nothing behind.
docs: 'https://www.librephotos.com'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-librephotos-net
    continueOnError: true

tasks:
  - name: librephotos
    run: docker run --rm --name quickrun-librephotos --network quickrun-librephotos-net -p 8001:8001 -e SERVE_FRONTEND="true" -e DB_BACKEND="sqlite" reallibrephotos/librephotos-unified:latest
    readyWhen: {http: 'http://localhost:8001'}
    open: true

stop:
  - run: docker rm -f quickrun-librephotos
    continueOnError: true
  - run: docker network rm quickrun-librephotos-net
    continueOnError: true
