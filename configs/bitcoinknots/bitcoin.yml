version: 1
name: Bitcoin Knots
repository: bitcoinknots/bitcoin
description: >-
  Bitcoin Knots enhanced Bitcoin node/wallet software Starts the official image
  (bitcoinknots/bitcoin:latest); nothing is stored, so stopping the run leaves nothing behind.
docs: 'https://bitcoinknots.org'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-bitcoin-knots-net
    continueOnError: true

tasks:
  - name: bitcoin-knots
    run: docker run --rm --name quickrun-bitcoin-knots --network quickrun-bitcoin-knots-net -p 8332:8332 bitcoinknots/bitcoin:latest
    readyWhen: {http: 'http://localhost:8332'}
    open: true

stop:
  - run: docker rm -f quickrun-bitcoin-knots
    continueOnError: true
  - run: docker network rm quickrun-bitcoin-knots-net
    continueOnError: true
