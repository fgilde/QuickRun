# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Snipe-IT
repository: snipe/snipe-it
description: >-
  Snipe-IT — IT asset and license management. MariaDB companion included. APP_KEY is generated
  for you and must stay stable; set APP_URL to the address you reach it on, then finish the
  setup in the browser. Starts the official image (snipe/snipe-it:latest); nothing is stored,
  so stopping the run leaves nothing behind.
docs: 'https://snipeitapp.com'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-snipe-it-net
    continueOnError: true

tasks:
  - name: db
    run: docker run --rm --name quickrun-snipe-it-db --network quickrun-snipe-it-net -e MYSQL_ROOT_PASSWORD="snipeit" -e MYSQL_DATABASE="snipeit" -e MYSQL_USER="snipeit" -e MYSQL_PASSWORD="snipeit" lscr.io/linuxserver/mariadb:latest
    readyWhen: {log: ready for connections}
  - name: snipe-it
    run: docker run --rm --name quickrun-snipe-it --network quickrun-snipe-it-net -p 80:80 -e MYSQL_PORT_3306_TCP_ADDR="quickrun-snipe-it-db" -e MYSQL_PORT_3306_TCP_PORT="3306" -e MYSQL_DATABASE="snipeit" -e MYSQL_USER="snipeit" -e MYSQL_PASSWORD="snipeit" -e APP_ENV="production" -e APP_DEBUG="false" -e PRIVATE_FILESYSTEM_DISK="local" -e PUBLIC_FILESYSTEM_DISK="local_public" snipe/snipe-it:latest
    dependsOn: [db]
    readyWhen: {http: 'http://localhost:80'}
    open: true

stop:
  - run: docker rm -f quickrun-snipe-it-db
    continueOnError: true
  - run: docker rm -f quickrun-snipe-it
    continueOnError: true
  - run: docker network rm quickrun-snipe-it-net
    continueOnError: true
