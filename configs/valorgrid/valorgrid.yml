# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: ValorGrid
repository: valorgrid/valorgrid
description: >-
  Add ValorGrid to the CasaOS AppStore. ... ValorGrid is a private, single-user local
  portfolio dashboard with SQLite persistence, local backups, and portfolio views for
  holdings, allocation, movements, monthly tracking, and history. Set an auth password
  (params); add an Alpha Vantage API key for live market prices. Starts the official image
  (ghcr.io/aivm23/valorgrid:v3.33.1); nothing is stored, so stopping the run leaves nothing
  behind.
docs: 'https://github.com/aivm23/valorgrid'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-valorgrid-net
    continueOnError: true

tasks:
  - name: valorgrid
    run: docker run --rm --name quickrun-valorgrid --network quickrun-valorgrid-net -p 1325:1325 -e HOST=0.0.0.0 -e PORT=1325 -e PORTFOLIO_DB_PATH=/data/portfolio.sqlite -e VALORGRID_BACKUP_DIR=/data/backups ghcr.io/aivm23/valorgrid:v3.33.1
    readyWhen: {http: 'http://localhost:1325'}
    open: true

stop:
  - run: docker rm -f quickrun-valorgrid
    continueOnError: true
  - run: docker network rm quickrun-valorgrid-net
    continueOnError: true
