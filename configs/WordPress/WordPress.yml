# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: WordPress
repository: WordPress/WordPress
description: >-
  WordPress — the classic PHP blog/CMS (official Apache image). Comes with a MariaDB
  companion; the famous five-minute install runs in the browser on first visit. Starts the
  official image (wordpress:latest); nothing is stored, so stopping the run leaves nothing
  behind.
docs: 'https://wordpress.org'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-wordpress-net
    continueOnError: true

tasks:
  - name: db
    run: docker run --rm --name quickrun-wordpress-db --network quickrun-wordpress-net -e MYSQL_ROOT_PASSWORD="wordpress" -e MYSQL_DATABASE="wordpress" -e MYSQL_USER="wordpress" -e MYSQL_PASSWORD="wordpress" lscr.io/linuxserver/mariadb:latest
    readyWhen: {log: ready for connections}
  - name: wordpress
    run: docker run --rm --name quickrun-wordpress --network quickrun-wordpress-net -p 80:80 -e WORDPRESS_DB_HOST="quickrun-wordpress-db" -e WORDPRESS_DB_NAME="wordpress" -e WORDPRESS_DB_USER="wordpress" -e WORDPRESS_DB_PASSWORD="wordpress" wordpress:latest
    dependsOn: [db]
    readyWhen: {http: 'http://localhost:80'}
    open: true

stop:
  - run: docker rm -f quickrun-wordpress-db
    continueOnError: true
  - run: docker rm -f quickrun-wordpress
    continueOnError: true
  - run: docker network rm quickrun-wordpress-net
    continueOnError: true
