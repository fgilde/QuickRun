# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Calibre-Web
repository: janeczku/calibre-web
description: >-
  :books: Web app for browsing, reading and downloading eBooks stored in a Calibre database
  Calibre-Web — clean web UI to browse/read/download your Calibre e-book library (login admin
  / admin123). Starts the official image (lscr.io/linuxserver/calibre-web:latest); nothing is
  stored, so stopping the run leaves nothing behind.
docs: 'https://github.com/janeczku/calibre-web'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-calibre-web-net
    continueOnError: true

tasks:
  - name: calibre-web
    run: docker run --rm --name quickrun-calibre-web --network quickrun-calibre-web-net -p 8083:8083 lscr.io/linuxserver/calibre-web:latest
    readyWhen: {http: 'http://localhost:8083'}
    open: true

stop:
  - run: docker rm -f quickrun-calibre-web
    continueOnError: true
  - run: docker network rm quickrun-calibre-web-net
    continueOnError: true
