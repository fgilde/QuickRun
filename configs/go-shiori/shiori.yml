# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Shiori
repository: go-shiori/shiori
description: >-
  Shiori — simple bookmarks manager (Pocket-like). First-run login is shiori / gopher — change
  it after logging in (Shiori has no env for initial credentials). SHIORI_HTTP_SECRET_KEY
  seeded as a parameter so sessions survive restarts. Starts the official image
  (ghcr.io/go-shiori/shiori:latest); nothing is stored, so stopping the run leaves nothing
  behind.
docs: 'https://github.com/go-shiori/shiori'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-shiori-net
    continueOnError: true

tasks:
  - name: shiori
    run: docker run --rm --name quickrun-shiori --network quickrun-shiori-net -p 8080:8080 ghcr.io/go-shiori/shiori:latest
    readyWhen: {http: 'http://localhost:8080'}
    open: true

stop:
  - run: docker rm -f quickrun-shiori
    continueOnError: true
  - run: docker network rm quickrun-shiori-net
    continueOnError: true
