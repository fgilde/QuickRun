# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: BookStack
repository: BookStackApp/BookStack
description: >-
  NOW MANAGED ON CODEBERG MariaDB companion. APP_KEY seeded (base64). Set APP_URL to how you
  reach it (default http://localhost). Built-in first login: admin@admin.com / password
  (change it). Starts the official image (lscr.io/linuxserver/bookstack:latest); nothing is
  stored, so stopping the run leaves nothing behind.
docs: 'https://www.bookstackapp.com'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-bookstack-net
    continueOnError: true

tasks:
  - name: db
    run: docker run --rm --name quickrun-bookstack-db --network quickrun-bookstack-net lscr.io/linuxserver/mariadb:latest
  - name: bookstack
    run: docker run --rm --name quickrun-bookstack --network quickrun-bookstack-net -p 80:80 -e DB_HOST="quickrun-bookstack-db" -e DB_PORT="3306" -e DB_DATABASE="bookstackapp" -e DB_USERNAME="bookstack" -e DB_PASSWORD="bookstack" lscr.io/linuxserver/bookstack:latest
    dependsOn: [db]
    readyWhen: {http: 'http://localhost:80'}
    open: true

stop:
  - run: docker rm -f quickrun-bookstack-db
    continueOnError: true
  - run: docker rm -f quickrun-bookstack
    continueOnError: true
  - run: docker network rm quickrun-bookstack-net
    continueOnError: true
