version: 1
name: AdGuard Home
repository: AdguardTeam/AdGuardHome
description: >-
  Network-wide ads & trackers blocking DNS server Starts the official image
  (adguard/adguardhome:latest); nothing is stored, so stopping the run leaves nothing behind.
docs: 'https://adguard.com/adguard-home/overview.html'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-adguard-net
    continueOnError: true

tasks:
  - name: adguard
    run: docker run --rm --name quickrun-adguard --network quickrun-adguard-net -p 3000:3000 adguard/adguardhome:latest
    readyWhen: {http: 'http://localhost:3000'}
    open: true

stop:
  - run: docker rm -f quickrun-adguard
    continueOnError: true
  - run: docker network rm quickrun-adguard-net
    continueOnError: true
