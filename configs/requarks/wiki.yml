# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Wiki.js
repository: requarks/wiki
description: >-
  Wiki.js — modern, powerful wiki. Postgres companion included. Starts the official image
  (ghcr.io/requarks/wiki:2); nothing is stored, so stopping the run leaves nothing behind.
docs: 'https://js.wiki'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-wikijs-net
    continueOnError: true

tasks:
  - name: db
    run: docker run --rm --name quickrun-wikijs-db --network quickrun-wikijs-net -e POSTGRES_DB="wiki" -e POSTGRES_USER="wikijs" -e POSTGRES_PASSWORD="wikijs" postgres:16
    readyWhen: {log: database system is ready to accept connections}
  - name: wikijs
    run: docker run --rm --name quickrun-wikijs --network quickrun-wikijs-net -p 3000:3000 -e DB_TYPE="postgres" -e DB_HOST="quickrun-wikijs-db" -e DB_PORT="5432" -e DB_USER="wikijs" -e DB_PASS="wikijs" -e DB_NAME="wiki" ghcr.io/requarks/wiki:2
    dependsOn: [db]
    readyWhen: {http: 'http://localhost:3000'}
    open: true

stop:
  - run: docker rm -f quickrun-wikijs-db
    continueOnError: true
  - run: docker rm -f quickrun-wikijs
    continueOnError: true
  - run: docker network rm quickrun-wikijs-net
    continueOnError: true
