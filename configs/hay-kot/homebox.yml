# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Homebox
repository: hay-kot/homebox
description: >-
  Homebox is the inventory and organization system built for the Home User Needs an API-key
  pepper (>= 32 bytes) — seeded as a parameter; rotating it invalidates issued API keys.
  Starts the official image (ghcr.io/sysadminsmedia/homebox:latest); nothing is stored, so
  stopping the run leaves nothing behind.
docs: 'https://homebox.software'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-homebox-net
    continueOnError: true

tasks:
  - name: homebox
    run: docker run --rm --name quickrun-homebox --network quickrun-homebox-net -p 7745:7745 ghcr.io/sysadminsmedia/homebox:latest
    readyWhen: {http: 'http://localhost:7745'}
    open: true

stop:
  - run: docker rm -f quickrun-homebox
    continueOnError: true
  - run: docker network rm quickrun-homebox-net
    continueOnError: true
