# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Linkwarden
repository: linkwarden/linkwarden
description: >-
  Linkwarden is a self-hosted, open-source collaborative bookmark manager to collect, read,
  annotate, and fully preserve what matters, all in one place. ... The objective is to
  organize useful webpages and articles you find across the web in one place, and since useful
  webpages can go away (see the inevitability of Link Rot), Linkwarden also saves a copy of
  each webpage in multiple formats, ensuring accessibility… Starts the official image
  (ghcr.io/linkwarden/linkwarden:latest); nothing is stored, so stopping the run leaves
  nothing behind.
docs: 'https://linkwarden.app'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-linkwarden-net
    continueOnError: true

tasks:
  - name: db
    run: docker run --rm --name quickrun-linkwarden-db --network quickrun-linkwarden-net -e POSTGRES_PASSWORD=linkwarden postgres:16
    readyWhen: {log: database system is ready to accept connections}
  - name: linkwarden
    run: docker run --rm --name quickrun-linkwarden --network quickrun-linkwarden-net -p 3000:3000 -e DATABASE_URL=postgresql://postgres:linkwarden@quickrun-linkwarden-db:5432/postgres ghcr.io/linkwarden/linkwarden:latest
    dependsOn: [db]
    readyWhen: {http: 'http://localhost:3000'}
    open: true

stop:
  - run: docker rm -f quickrun-linkwarden-db
    continueOnError: true
  - run: docker rm -f quickrun-linkwarden
    continueOnError: true
  - run: docker network rm quickrun-linkwarden-net
    continueOnError: true
