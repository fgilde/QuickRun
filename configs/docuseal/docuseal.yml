version: 1
name: DocuSeal
repository: docuseal/docuseal
description: >-
  DocuSeal — open-source document signing (DocuSign alternative). SQLite by default (set
  DATABASE_URL for Postgres/MySQL). Create the admin account on first visit. Starts the
  official image (docuseal/docuseal:latest); nothing is stored, so stopping the run leaves
  nothing behind.
docs: 'https://www.docuseal.com'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-docuseal-net
    continueOnError: true

tasks:
  - name: docuseal
    run: docker run --rm --name quickrun-docuseal --network quickrun-docuseal-net -p 3000:3000 docuseal/docuseal:latest
    readyWhen: {http: 'http://localhost:3000'}
    open: true

stop:
  - run: docker rm -f quickrun-docuseal
    continueOnError: true
  - run: docker network rm quickrun-docuseal-net
    continueOnError: true
