version: 1
name: Duplicati
repository: duplicati/duplicati
description: >-
  Store securely encrypted backups in the cloud! Starts the official image
  (lscr.io/linuxserver/duplicati:latest); nothing is stored, so stopping the run leaves
  nothing behind.
docs: 'https://www.duplicati.com'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-duplicati-net
    continueOnError: true

tasks:
  - name: duplicati
    run: docker run --rm --name quickrun-duplicati --network quickrun-duplicati-net -p 8200:8200 lscr.io/linuxserver/duplicati:latest
    readyWhen: {http: 'http://localhost:8200'}
    open: true

stop:
  - run: docker rm -f quickrun-duplicati
    continueOnError: true
  - run: docker network rm quickrun-duplicati-net
    continueOnError: true
