# Edit by hand only if you also remove this file from configs/GENERATED.
#
# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: IT-Tools
repository: CorentinTh/it-tools
description: >-
  IT-Tools — a big box of handy dev utilities (encoders, converters, generators…). Starts the
  official image (ghcr.io/corentinth/it-tools:latest); nothing is stored, so stopping the run
  leaves nothing behind.
docs: 'https://it-tools.tech'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-it-tools-net
    continueOnError: true

tasks:
  - name: it-tools
    run: docker run --rm --name quickrun-it-tools --network quickrun-it-tools-net -p 80:80 ghcr.io/corentinth/it-tools:latest
    readyWhen: {http: 'http://localhost:80'}
    open: true

stop:
  - run: docker rm -f quickrun-it-tools
    continueOnError: true
  - run: docker network rm quickrun-it-tools-net
    continueOnError: true
