# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: ArchiveBox
repository: ArchiveBox/ArchiveBox
description: >-
  🗃 Open source self-hosted web archiving. Takes URLs/browser
  history/bookmarks/Pocket/Pinboard/etc., saves HTML, JS, PDFs, media, and more... Create an
  admin login with 'archivebox manage createsuperuser' in the container. Starts the official
  image (archivebox/archivebox:latest); nothing is stored, so stopping the run leaves nothing
  behind.
docs: 'https://archivebox.io'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-archivebox-net
    continueOnError: true

tasks:
  - name: archivebox
    run: docker run --rm --name quickrun-archivebox --network quickrun-archivebox-net -p 8000:8000 archivebox/archivebox:latest
    readyWhen: {http: 'http://localhost:8000'}
    open: true

stop:
  - run: docker rm -f quickrun-archivebox
    continueOnError: true
  - run: docker network rm quickrun-archivebox-net
    continueOnError: true
