# Generated by scripts/build-collection.mjs from AspireUI's container catalogue.
# Edit by hand only if you also remove this file from configs/GENERATED.
#
# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Planka
repository: plankanban/planka
description: >-
  Planka — Trello-style kanban boards. Postgres companion. Set BASE_URL to how you reach it
  (default localhost:1337). Login = the seeded admin email / password (default
  admin@aspireui.local / please-change-me). Starts the official image
  (ghcr.io/plankanban/planka:latest); nothing is stored, so stopping the run leaves nothing
  behind.
docs: 'https://planka.app'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-planka-net
    continueOnError: true

tasks:
  - name: db
    run: docker run --rm --name quickrun-planka-db --network quickrun-planka-net postgres:16
  - name: planka
    run: docker run --rm --name quickrun-planka --network quickrun-planka-net -p 1337:1337 -e DATABASE_URL="postgresql://planka:planka@quickrun-planka-db/planka" -e DEFAULT_ADMIN_NAME="Admin" -e DEFAULT_ADMIN_USERNAME="admin" ghcr.io/plankanban/planka:latest
    dependsOn: [db]
    readyWhen: {http: 'http://localhost:1337'}
    open: true

stop:
  - run: docker rm -f quickrun-planka-db
    continueOnError: true
  - run: docker rm -f quickrun-planka
    continueOnError: true
  - run: docker network rm quickrun-planka-net
    continueOnError: true
