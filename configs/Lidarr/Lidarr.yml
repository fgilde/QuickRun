# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Lidarr
repository: Lidarr/Lidarr
description: >-
  Lidarr — music collection manager for the *arr stack (pairs with Prowlarr + a download
  client). Starts the official image (lscr.io/linuxserver/lidarr:latest); nothing is stored,
  so stopping the run leaves nothing behind.
docs: 'https://lidarr.audio'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-lidarr-net
    continueOnError: true

tasks:
  - name: lidarr
    run: docker run --rm --name quickrun-lidarr --network quickrun-lidarr-net -p 8686:8686 lscr.io/linuxserver/lidarr:latest
    readyWhen: {http: 'http://localhost:8686'}
    open: true

stop:
  - run: docker rm -f quickrun-lidarr
    continueOnError: true
  - run: docker network rm quickrun-lidarr-net
    continueOnError: true
