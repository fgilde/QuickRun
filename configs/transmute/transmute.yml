# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Transmute
repository: transmute/transmute
description: >-
  Self hosted file converter for images, video, audio, json, excel and more. Supports close to
  3,000 conversions! ... **Transmute** is a free, open-source, self-hosted file conversion and
  compression tool built for privacy and automation. Convert images, video, audio, documents,
  spreadsheets, subtitles, and fonts entirely locally, or compress supported files to make
  them smaller without sending anything to a third… Starts the official image
  (ghcr.io/transmute-app/transmute:latest); nothing is stored, so stopping the run leaves
  nothing behind.
docs: 'https://transmute.sh'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-transmute-net
    continueOnError: true

tasks:
  - name: transmute
    run: docker run --rm --name quickrun-transmute --network quickrun-transmute-net -p 3313:3313 ghcr.io/transmute-app/transmute:latest
    readyWhen: {http: 'http://localhost:3313'}
    open: true

stop:
  - run: docker rm -f quickrun-transmute
    continueOnError: true
  - run: docker network rm quickrun-transmute-net
    continueOnError: true
