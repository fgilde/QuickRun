version: 1
name: Pi-hole
repository: pi-hole/pi-hole
description: >-
  Pi-hole — network-wide ad/tracker blocking DNS. Admin login password seeded as a parameter
  (change it). Also binds DNS on :53 (host port conflicts possible). Starts the official image
  (pihole/pihole:latest); nothing is stored, so stopping the run leaves nothing behind.
docs: 'https://pi-hole.net'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-pihole-net
    continueOnError: true

tasks:
  - name: pihole
    run: docker run --rm --name quickrun-pihole --network quickrun-pihole-net -p 80:80 pihole/pihole:latest
    readyWhen: {http: 'http://localhost:80'}
    open: true

stop:
  - run: docker rm -f quickrun-pihole
    continueOnError: true
  - run: docker network rm quickrun-pihole-net
    continueOnError: true
