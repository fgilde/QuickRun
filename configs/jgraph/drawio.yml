version: 1
name: Draw.io
repository: jgraph/drawio
description: >-
  draw.io is a JavaScript, client-side editor for general diagramming. Starts the official
  image (jgraph/drawio:latest); nothing is stored, so stopping the run leaves nothing behind.
docs: 'https://www.drawio.com'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-drawio-net
    continueOnError: true

tasks:
  - name: drawio
    run: docker run --rm --name quickrun-drawio --network quickrun-drawio-net -p 8080:8080 jgraph/drawio:latest
    readyWhen: {http: 'http://localhost:8080'}
    open: true

stop:
  - run: docker rm -f quickrun-drawio
    continueOnError: true
  - run: docker network rm quickrun-drawio-net
    continueOnError: true
