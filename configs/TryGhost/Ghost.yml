# Edit by hand only if you also remove this file from configs/GENERATED.
#
# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Ghost
repository: TryGhost/Ghost
description: >-
  Independent technology for modern publishing, memberships, subscriptions and newsletters.
  MySQL companion (Ghost 5 requires MySQL). Set url to how you reach it (default
  localhost:2368). Starts the official image (ghost:5-alpine); nothing is stored, so stopping
  the run leaves nothing behind.
docs: 'https://ghost.org'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-ghost-net
    continueOnError: true

tasks:
  - name: db
    run: docker run --rm --name quickrun-ghost-db --network quickrun-ghost-net -e MYSQL_ROOT_PASSWORD="ghost" -e MYSQL_DATABASE="ghost" -e MYSQL_USER="ghost" -e MYSQL_PASSWORD="ghost" mysql:8
    readyWhen: {log: ready for connections}
  - name: ghost
    run: docker run --rm --name quickrun-ghost --network quickrun-ghost-net -p 2368:2368 -e database__client="mysql" -e database__connection__host="quickrun-ghost-db" -e database__connection__user="ghost" -e database__connection__password="ghost" -e database__connection__database="ghost" ghost:5-alpine
    dependsOn: [db]
    readyWhen: {http: 'http://localhost:2368'}
    open: true

stop:
  - run: docker rm -f quickrun-ghost-db
    continueOnError: true
  - run: docker rm -f quickrun-ghost
    continueOnError: true
  - run: docker network rm quickrun-ghost-net
    continueOnError: true
