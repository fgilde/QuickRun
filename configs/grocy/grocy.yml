version: 1
name: Grocy
repository: grocy/grocy
description: >-
  ERP beyond your fridge - Grocy is a web-based self-hosted groceries & household management
  solution for your home Grocy — ERP for your fridge: groceries, stock, chores & recipes
  (login admin / admin). Starts the official image (lscr.io/linuxserver/grocy:latest); nothing
  is stored, so stopping the run leaves nothing behind.
docs: 'https://grocy.info'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-grocy-net
    continueOnError: true

tasks:
  - name: grocy
    run: docker run --rm --name quickrun-grocy --network quickrun-grocy-net -p 80:80 lscr.io/linuxserver/grocy:latest
    readyWhen: {http: 'http://localhost:80'}
    open: true

stop:
  - run: docker rm -f quickrun-grocy
    continueOnError: true
  - run: docker network rm quickrun-grocy-net
    continueOnError: true
