# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: autobrr
repository: autobrr/autobrr
description: >-
  autobrr — real-time download automation from IRC announce + RSS into the *arr apps /
  download clients. Create the account on first visit. Starts the official image
  (ghcr.io/autobrr/autobrr:latest); nothing is stored, so stopping the run leaves nothing
  behind.
docs: 'https://autobrr.com'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-autobrr-net
    continueOnError: true

tasks:
  - name: autobrr
    run: docker run --rm --name quickrun-autobrr --network quickrun-autobrr-net -p 7474:7474 ghcr.io/autobrr/autobrr:latest
    readyWhen: {http: 'http://localhost:7474'}
    open: true

stop:
  - run: docker rm -f quickrun-autobrr
    continueOnError: true
  - run: docker network rm quickrun-autobrr-net
    continueOnError: true
