# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Emby
repository: MediaBrowser/Emby
description: >-
  Emby Server is a personal media server with apps on just about every device. Create the
  admin account via the first-run wizard. Mount your media; GPU for transcoding. Starts the
  official image (emby/embyserver:latest); nothing is stored, so stopping the run leaves
  nothing behind.
docs: 'https://emby.media'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-emby-net
    continueOnError: true

tasks:
  - name: emby
    run: docker run --rm --name quickrun-emby --network quickrun-emby-net -p 8096:8096 emby/embyserver:latest
    readyWhen: {http: 'http://localhost:8096'}
    open: true

stop:
  - run: docker rm -f quickrun-emby
    continueOnError: true
  - run: docker network rm quickrun-emby-net
    continueOnError: true
