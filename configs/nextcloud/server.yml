version: 1
name: Nextcloud
repository: nextcloud/server
description: >-
  Nextcloud — self-hosted files, calendar, collaboration. Starts the official image
  (nextcloud:latest); nothing is stored, so stopping the run leaves nothing behind.
docs: 'https://nextcloud.com'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-nextcloud-net
    continueOnError: true

tasks:
  - name: nextcloud
    run: docker run --rm --name quickrun-nextcloud --network quickrun-nextcloud-net -p 80:80 nextcloud:latest
    readyWhen: {http: 'http://localhost:80'}
    open: true

stop:
  - run: docker rm -f quickrun-nextcloud
    continueOnError: true
  - run: docker network rm quickrun-nextcloud-net
    continueOnError: true
