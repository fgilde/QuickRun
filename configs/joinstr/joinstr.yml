# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Joinstr
repository: joinstr/joinstr
description: >-
  Joinstr — Nostr-based coinjoin wallet UI. Requires an external Bitcoin Core node over RPC
  (set the RPC params) — useless without a node. Starts the official image
  (ghcr.io/1440000bytes/joinstr-web:0.1.1); nothing is stored, so stopping the run leaves
  nothing behind.
docs: 'https://github.com/1440000bytes/joinstr'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-joinstr-net
    continueOnError: true

tasks:
  - name: joinstr
    run: docker run --rm --name quickrun-joinstr --network quickrun-joinstr-net -p 5000:5000 -e JOINSTR_MANAGED="1" -e JOINSTR_WALLET="joinstr" -e JOINSTR_DATA_DIR="/app/data" ghcr.io/1440000bytes/joinstr-web:0.1.1
    readyWhen: {http: 'http://localhost:5000'}
    open: true

stop:
  - run: docker rm -f quickrun-joinstr
    continueOnError: true
  - run: docker network rm quickrun-joinstr-net
    continueOnError: true
