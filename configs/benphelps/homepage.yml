# Generated by scripts/build-collection.mjs from AspireUI's container catalogue.
# Edit by hand only if you also remove this file from configs/GENERATED.
#
# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Homepage
repository: benphelps/homepage
description: >-
  A modern, fully static, fast, secure fully proxied, highly customizable application
  dashboard with integrations for over 100 services and translations into multiple languages.
  Easily configured via YAML files or through docker label discovery. HOMEPAGE_ALLOWED_HOSTS=*
  (dev) so it doesn't reject the Aspire host; config volume so /app/config exists. Starts the
  official image (ghcr.io/gethomepage/homepage:latest); nothing is stored, so stopping the run
  leaves nothing behind.
docs: 'https://gethomepage.dev'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-homepage-net
    continueOnError: true

tasks:
  - name: homepage
    run: docker run --rm --name quickrun-homepage --network quickrun-homepage-net -p 3000:3000 -e HOMEPAGE_ALLOWED_HOSTS="*" ghcr.io/gethomepage/homepage:latest
    readyWhen: {http: 'http://localhost:3000'}
    open: true

stop:
  - run: docker rm -f quickrun-homepage
    continueOnError: true
  - run: docker network rm quickrun-homepage-net
    continueOnError: true
