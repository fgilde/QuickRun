# Generated by scripts/build-collection.mjs from AspireUI's container catalogue.
# Edit by hand only if you also remove this file from configs/GENERATED.
#
# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: CyberChef
repository: gchq/CyberChef
description: >-
  The Cyber Swiss Army Knife - a web app for encryption, encoding, compression and data
  analysis Starts the official image (mpepping/cyberchef:latest); nothing is stored, so
  stopping the run leaves nothing behind.
docs: 'https://gchq.github.io/CyberChef/'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-cyberchef-net
    continueOnError: true

tasks:
  - name: cyberchef
    run: docker run --rm --name quickrun-cyberchef --network quickrun-cyberchef-net -p 8000:8000 mpepping/cyberchef:latest
    readyWhen: {http: 'http://localhost:8000'}
    open: true

stop:
  - run: docker rm -f quickrun-cyberchef
    continueOnError: true
  - run: docker network rm quickrun-cyberchef-net
    continueOnError: true
