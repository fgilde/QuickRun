# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Matomo
repository: matomo-org/matomo
description: >-
  Matomo — self-hosted web analytics (the Google Analytics alternative), official Apache
  image. MariaDB companion included; the browser installer picks up the database settings,
  then you create the super user. Starts the official image (matomo:apache); nothing is
  stored, so stopping the run leaves nothing behind.
docs: 'https://matomo.org'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-matomo-net
    continueOnError: true

tasks:
  - name: db
    run: docker run --rm --name quickrun-matomo-db --network quickrun-matomo-net -e MYSQL_ROOT_PASSWORD="matomo" -e MYSQL_DATABASE="matomo" -e MYSQL_USER="matomo" -e MYSQL_PASSWORD="matomo" lscr.io/linuxserver/mariadb:latest
    readyWhen: {log: ready for connections}
  - name: matomo
    run: docker run --rm --name quickrun-matomo --network quickrun-matomo-net -p 80:80 -e MATOMO_DATABASE_HOST="quickrun-matomo-db" -e MATOMO_DATABASE_ADAPTER="mysql" -e MATOMO_DATABASE_DBNAME="matomo" -e MATOMO_DATABASE_USERNAME="matomo" -e MATOMO_DATABASE_PASSWORD="matomo" matomo:apache
    dependsOn: [db]
    readyWhen: {http: 'http://localhost:80'}
    open: true

stop:
  - run: docker rm -f quickrun-matomo-db
    continueOnError: true
  - run: docker rm -f quickrun-matomo
    continueOnError: true
  - run: docker network rm quickrun-matomo-net
    continueOnError: true
