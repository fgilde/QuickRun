# Generated by scripts/build-collection.mjs from AspireUI's container catalogue.
# Edit by hand only if you also remove this file from configs/GENERATED.
#
# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: ntfy
repository: binwiederhier/ntfy
description: >-
  ntfy — simple pub/sub push notifications to your phone/desktop via HTTP. Runs the 'serve'
  subcommand (bare ntfy just prints help and exits). Starts the official image
  (binwiederhier/ntfy:latest); nothing is stored, so stopping the run leaves nothing behind.
docs: 'https://ntfy.sh'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-ntfy-net
    continueOnError: true

tasks:
  - name: ntfy
    run: docker run --rm --name quickrun-ntfy --network quickrun-ntfy-net -p 80:80 binwiederhier/ntfy:latest
    readyWhen: {http: 'http://localhost:80'}
    open: true

stop:
  - run: docker rm -f quickrun-ntfy
    continueOnError: true
  - run: docker network rm quickrun-ntfy-net
    continueOnError: true
