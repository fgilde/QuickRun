# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Piwigo
repository: Piwigo/Piwigo
description: >-
  Piwigo — photo gallery manager for large collections. MariaDB companion included; the
  browser installer asks for the database — host piwigo-db, name/user/password all "piwigo".
  Starts the official image (lscr.io/linuxserver/piwigo:latest); nothing is stored, so
  stopping the run leaves nothing behind.
docs: 'https://piwigo.org'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-piwigo-net
    continueOnError: true

tasks:
  - name: db
    run: docker run --rm --name quickrun-piwigo-db --network quickrun-piwigo-net -e MYSQL_ROOT_PASSWORD="piwigo" -e MYSQL_DATABASE="piwigo" -e MYSQL_USER="piwigo" -e MYSQL_PASSWORD="piwigo" lscr.io/linuxserver/mariadb:latest
    readyWhen: {log: ready for connections}
  - name: piwigo
    run: docker run --rm --name quickrun-piwigo --network quickrun-piwigo-net -p 80:80 lscr.io/linuxserver/piwigo:latest
    dependsOn: [db]
    readyWhen: {http: 'http://localhost:80'}
    open: true

stop:
  - run: docker rm -f quickrun-piwigo-db
    continueOnError: true
  - run: docker rm -f quickrun-piwigo
    continueOnError: true
  - run: docker network rm quickrun-piwigo-net
    continueOnError: true
