# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Gitea
repository: go-gitea/gitea
description: >-
  Git with a cup of tea! Painless self-hosted all-in-one software development service,
  including Git hosting, code review, team collaboration, package registry and CI/CD Starts
  the official image (gitea/gitea:latest); nothing is stored, so stopping the run leaves
  nothing behind.
docs: 'https://about.gitea.com'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-gitea-net
    continueOnError: true

tasks:
  - name: gitea
    run: docker run --rm --name quickrun-gitea --network quickrun-gitea-net -p 3000:3000 gitea/gitea:latest
    readyWhen: {http: 'http://localhost:3000'}
    open: true

stop:
  - run: docker rm -f quickrun-gitea
    continueOnError: true
  - run: docker network rm quickrun-gitea-net
    continueOnError: true
