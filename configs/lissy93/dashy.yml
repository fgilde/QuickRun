# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Dashy
repository: lissy93/dashy
description: >-
  🚀 A self-hostable personal dashboard built for you. Includes status-checking, widgets,
  themes, icon packs, a UI editor and tons more! Starts the official image
  (lissy93/dashy:latest); nothing is stored, so stopping the run leaves nothing behind.
docs: 'https://dashy.to'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-dashy-net
    continueOnError: true

tasks:
  - name: dashy
    run: docker run --rm --name quickrun-dashy --network quickrun-dashy-net -p 8080:8080 lissy93/dashy:latest
    readyWhen: {http: 'http://localhost:8080'}
    open: true

stop:
  - run: docker rm -f quickrun-dashy
    continueOnError: true
  - run: docker network rm quickrun-dashy-net
    continueOnError: true
