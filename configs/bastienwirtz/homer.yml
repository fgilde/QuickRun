# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Homer
repository: bastienwirtz/homer
description: >-
  Homer — a dead-simple static homepage/dashboard for your services (edit assets/config.yml).
  Starts the official image (b4bz/homer:latest); nothing is stored, so stopping the run leaves
  nothing behind.
docs: 'https://github.com/bastienwirtz/homer'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-homer-net
    continueOnError: true

tasks:
  - name: homer
    run: docker run --rm --name quickrun-homer --network quickrun-homer-net -p 8080:8080 b4bz/homer:latest
    readyWhen: {http: 'http://localhost:8080'}
    open: true

stop:
  - run: docker rm -f quickrun-homer
    continueOnError: true
  - run: docker network rm quickrun-homer-net
    continueOnError: true
