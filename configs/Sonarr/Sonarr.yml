version: 1
name: Sonarr
repository: Sonarr/Sonarr
description: >-
  ## Sonarr is an internet PVR for Usenet and Torrents. ... Sonarr is an internet PVR for
  Usenet and Torrents. ... Sonarr is supported natively on Windows. Sonarr can be installed as
  Windows Service or System Tray Application. Starts the official image
  (lscr.io/linuxserver/sonarr:latest); nothing is stored, so stopping the run leaves nothing
  behind.
docs: 'https://sonarr.tv'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-sonarr-net
    continueOnError: true

tasks:
  - name: sonarr
    run: docker run --rm --name quickrun-sonarr --network quickrun-sonarr-net -p 8989:8989 lscr.io/linuxserver/sonarr:latest
    readyWhen: {http: 'http://localhost:8989'}
    open: true

stop:
  - run: docker rm -f quickrun-sonarr
    continueOnError: true
  - run: docker network rm quickrun-sonarr-net
    continueOnError: true
