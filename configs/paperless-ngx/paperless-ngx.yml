# Edit by hand only if you also remove this file from configs/GENERATED.
#
# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Paperless-ngx
repository: paperless-ngx/paperless-ngx
description: >-
  Paperless-ngx — scan/OCR document management. Comes with a Postgres + Redis companion
  (scaffold — finish the connection env). Starts the official image
  (ghcr.io/paperless-ngx/paperless-ngx:latest); nothing is stored, so stopping the run leaves
  nothing behind.
docs: 'https://docs.paperless-ngx.com'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-paperless-ngx-net
    continueOnError: true

tasks:
  - name: db
    run: docker run --rm --name quickrun-paperless-ngx-db --network quickrun-paperless-ngx-net -e POSTGRES_DB="paperless" -e POSTGRES_USER="paperless" -e POSTGRES_PASSWORD="paperless" postgres:16
    readyWhen: {log: database system is ready to accept connections}
  - name: redis
    run: docker run --rm --name quickrun-paperless-ngx-redis --network quickrun-paperless-ngx-net -p 6379:6379 redis:7
    readyWhen: {log: Ready to accept connections}
  - name: paperless-ngx
    run: docker run --rm --name quickrun-paperless-ngx --network quickrun-paperless-ngx-net -p 8000:8000 -e PAPERLESS_DBHOST="quickrun-paperless-ngx-db" -e PAPERLESS_DBUSER="paperless" -e PAPERLESS_DBPASS="paperless" -e PAPERLESS_REDIS="redis://quickrun-paperless-ngx-redis:6379" ghcr.io/paperless-ngx/paperless-ngx:latest
    dependsOn: [db, redis]
    readyWhen: {http: 'http://localhost:8000'}
    open: true

stop:
  - run: docker rm -f quickrun-paperless-ngx-db
    continueOnError: true
  - run: docker rm -f quickrun-paperless-ngx-redis
    continueOnError: true
  - run: docker rm -f quickrun-paperless-ngx
    continueOnError: true
  - run: docker network rm quickrun-paperless-ngx-net
    continueOnError: true
