# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Foldergram
repository: foldergram/foldergram
description: >-
  Self-hosted folder-based Instagram-style photo and video gallery app. Point volumes at your
  media. Starts the official image (ghcr.io/foldergram/foldergram:latest); nothing is stored,
  so stopping the run leaves nothing behind.
docs: 'https://github.com/foldergram/foldergram'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-foldergram-net
    continueOnError: true

tasks:
  - name: foldergram
    run: docker run --rm --name quickrun-foldergram --network quickrun-foldergram-net -p 4141:4141 -e IMAGE_DETAIL_SOURCE=preview -e DERIVATIVE_MODE=eager ghcr.io/foldergram/foldergram:latest
    readyWhen: {http: 'http://localhost:4141'}
    open: true

stop:
  - run: docker rm -f quickrun-foldergram
    continueOnError: true
  - run: docker network rm quickrun-foldergram-net
    continueOnError: true
