# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Grav
repository: getgrav/grav
description: >-
  Grav — flat-file PHP CMS: no database, content is Markdown on disk. Create the admin account
  in the browser on first visit. Starts the official image (lscr.io/linuxserver/grav:latest);
  nothing is stored, so stopping the run leaves nothing behind.
docs: 'https://getgrav.org'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-grav-net
    continueOnError: true

tasks:
  - name: grav
    run: docker run --rm --name quickrun-grav --network quickrun-grav-net -p 80:80 lscr.io/linuxserver/grav:latest
    readyWhen: {http: 'http://localhost:80'}
    open: true

stop:
  - run: docker rm -f quickrun-grav
    continueOnError: true
  - run: docker network rm quickrun-grav-net
    continueOnError: true
