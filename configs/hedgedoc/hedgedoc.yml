# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: HedgeDoc
repository: hedgedoc/hedgedoc
description: >-
  HedgeDoc - Ideas grow better together Postgres companion. Set CMD_DOMAIN to your host
  (default localhost) — CMD_URL_ADDPORT keeps the port in links. Starts the official image
  (quay.io/hedgedoc/hedgedoc:latest); nothing is stored, so stopping the run leaves nothing
  behind.
docs: 'https://hedgedoc.org'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-hedgedoc-net
    continueOnError: true

tasks:
  - name: db
    run: docker run --rm --name quickrun-hedgedoc-db --network quickrun-hedgedoc-net -e POSTGRES_DB=hedgedoc -e POSTGRES_USER=hedgedoc -e POSTGRES_PASSWORD=hedgedoc postgres:16
    readyWhen: {log: database system is ready to accept connections}
  - name: hedgedoc
    run: docker run --rm --name quickrun-hedgedoc --network quickrun-hedgedoc-net -p 3000:3000 -e CMD_DB_URL=postgres://hedgedoc:hedgedoc@quickrun-hedgedoc-db:5432/hedgedoc -e CMD_URL_ADDPORT=true -e CMD_PROTOCOL_USESSL=false -e CMD_ALLOW_ORIGIN="*" quay.io/hedgedoc/hedgedoc:latest
    dependsOn: [db]
    readyWhen: {http: 'http://localhost:3000'}
    open: true

stop:
  - run: docker rm -f quickrun-hedgedoc-db
    continueOnError: true
  - run: docker rm -f quickrun-hedgedoc
    continueOnError: true
  - run: docker network rm quickrun-hedgedoc-net
    continueOnError: true
