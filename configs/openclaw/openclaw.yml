# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: OpenClaw
repository: openclaw/openclaw
description: >-
  OpenClaw — AI 'does-things' agent with a bundled headless browser + control UI. APP_SEED
  (identity/encryption) seeded as a parameter — keep it stable or state is lost. Model
  provider key set in-app. Starts the official image
  (ghcr.io/getumbrel/openclaw-umbrel:2026.7.1-1); nothing is stored, so stopping the run
  leaves nothing behind.
docs: 'https://github.com/getumbrel/openclaw-umbrel'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-openclaw-net
    continueOnError: true

tasks:
  - name: openclaw
    run: docker run --rm --name quickrun-openclaw --network quickrun-openclaw-net -p 18789:18789 ghcr.io/getumbrel/openclaw-umbrel:2026.7.1-1
    readyWhen: {http: 'http://localhost:18789'}
    open: true

stop:
  - run: docker rm -f quickrun-openclaw
    continueOnError: true
  - run: docker network rm quickrun-openclaw-net
    continueOnError: true
