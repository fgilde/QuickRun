version: 1
name: Dockge
repository: louislam/dockge
description: >-
  A fancy, easy-to-use and reactive self-hosted docker compose.yaml stack-oriented manager
  Starts the official image (louislam/dockge:1); nothing is stored, so stopping the run leaves
  nothing behind.
docs: 'https://github.com/louislam/dockge'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-dockge-net
    continueOnError: true

tasks:
  - name: dockge
    run: docker run --rm --name quickrun-dockge --network quickrun-dockge-net -p 5001:5001 louislam/dockge:1
    readyWhen: {http: 'http://localhost:5001'}
    open: true

stop:
  - run: docker rm -f quickrun-dockge
    continueOnError: true
  - run: docker network rm quickrun-dockge-net
    continueOnError: true
