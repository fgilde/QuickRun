version: 1
name: OctoPrint
repository: OctoPrint/OctoPrint
description: >-
  OctoPrint — web control & monitoring for a 3D printer. Starts into the setup wizard; to
  print, pass the printer's serial device. Starts the official image
  (octoprint/octoprint:latest); nothing is stored, so stopping the run leaves nothing behind.
docs: 'https://octoprint.org'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-octoprint-net
    continueOnError: true

tasks:
  - name: octoprint
    run: docker run --rm --name quickrun-octoprint --network quickrun-octoprint-net -p 80:80 octoprint/octoprint:latest
    readyWhen: {http: 'http://localhost:80'}
    open: true

stop:
  - run: docker rm -f quickrun-octoprint
    continueOnError: true
  - run: docker network rm quickrun-octoprint-net
    continueOnError: true
