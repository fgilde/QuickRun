version: 1
name: changedetection.io
repository: dgtlmoon/changedetection.io
description: >-
  changedetection.io — watch web pages for changes and get notified. (Add a
  Playwright/browserless companion later for JS-heavy pages.) Starts the official image
  (ghcr.io/dgtlmoon/changedetection.io:latest); nothing is stored, so stopping the run leaves
  nothing behind.
docs: 'https://changedetection.io'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-changedetection-net
    continueOnError: true

tasks:
  - name: changedetection
    run: docker run --rm --name quickrun-changedetection --network quickrun-changedetection-net -p 5000:5000 ghcr.io/dgtlmoon/changedetection.io:latest
    readyWhen: {http: 'http://localhost:5000'}
    open: true

stop:
  - run: docker rm -f quickrun-changedetection
    continueOnError: true
  - run: docker network rm quickrun-changedetection-net
    continueOnError: true
