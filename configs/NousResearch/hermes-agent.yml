# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Hermes Agent
repository: NousResearch/hermes-agent
description: >-
  Hermes Agent (Nous Research) — AI agent gateway + dashboard. Runs standalone with the auth
  gate off (HERMES_UMBREL_APP_PROXY_AUTH=1) so the dashboard is UNAUTHENTICATED — only expose
  on a trusted LAN, not publicly. Supply model API keys in-app. Starts the official image
  (ghcr.io/getumbrel/hermes-agent-umbrel:v2026.7.20); nothing is stored, so stopping the run
  leaves nothing behind.
docs: 'https://nousresearch.com'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-hermes-agent-net
    continueOnError: true

tasks:
  - name: hermes-agent
    run: docker run --rm --name quickrun-hermes-agent --network quickrun-hermes-agent-net -p 18789:18789 -e HERMES_DASHBOARD=1 -e HERMES_DASHBOARD_PORT=18789 -e HERMES_UMBREL_APP_PROXY_AUTH=1 ghcr.io/getumbrel/hermes-agent-umbrel:v2026.7.20
    readyWhen: {http: 'http://localhost:18789'}
    open: true

stop:
  - run: docker rm -f quickrun-hermes-agent
    continueOnError: true
  - run: docker network rm quickrun-hermes-agent-net
    continueOnError: true
