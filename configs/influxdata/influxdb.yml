version: 1
name: InfluxDB v2
repository: influxdata/influxdb
description: >-
  # Quantified Self: Building a Pro-Level Health Dashboard with InfluxDB and Grafana ... In
  this tutorial, we are diving deep into Health Data Engineering. We will use InfluxDB as our
  high-performance time-series engine, Grafana for stunning visualizations, and Airflow to
  orchestrate the ETL (Extract, Transform, Load) process. By the end of this guide, you’ll
  have a professional-grade Quantified Self dashboard that… Starts the official image
  (influxdb:2); nothing is stored, so stopping the run leaves nothing behind.
docs: 'https://www.influxdata.com'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-influxdb-net
    continueOnError: true

tasks:
  - name: influxdb
    run: docker run --rm --name quickrun-influxdb --network quickrun-influxdb-net -p 8086:8086 -e DOCKER_INFLUXDB_INIT_MODE=setup -e DOCKER_INFLUXDB_INIT_ORG=aspireui -e DOCKER_INFLUXDB_INIT_BUCKET=default influxdb:2
    readyWhen: {http: 'http://localhost:8086'}
    open: true

stop:
  - run: docker rm -f quickrun-influxdb
    continueOnError: true
  - run: docker network rm quickrun-influxdb-net
    continueOnError: true
