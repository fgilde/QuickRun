# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Whisper ASR
repository: ahmetoner/whisper-asr-webservice
description: >-
  Whisper ASR web service — speech-to-text HTTP API (openai-whisper / faster-whisper). Starts
  the official image (onerahmet/openai-whisper-asr-webservice:latest); nothing is stored, so
  stopping the run leaves nothing behind.
docs: 'https://github.com/ahmetoner/whisper-asr-webservice'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-whisper-asr-net
    continueOnError: true

tasks:
  - name: whisper-asr
    run: docker run --rm --name quickrun-whisper-asr --network quickrun-whisper-asr-net -p 9000:9000 onerahmet/openai-whisper-asr-webservice:latest
    readyWhen: {http: 'http://localhost:9000'}
    open: true

stop:
  - run: docker rm -f quickrun-whisper-asr
    continueOnError: true
  - run: docker network rm quickrun-whisper-asr-net
    continueOnError: true
