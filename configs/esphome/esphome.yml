# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: ESPHome
repository: esphome/esphome
description: >-
  ESPHome is a system to control your ESP32, ESP8266, BK72xx, RP2040 by simple yet powerful
  configuration files and control them remotely through Home Automation systems. Starts the
  official image (ghcr.io/esphome/esphome:latest); nothing is stored, so stopping the run
  leaves nothing behind.
docs: 'https://esphome.io'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-esphome-net
    continueOnError: true

tasks:
  - name: esphome
    run: docker run --rm --name quickrun-esphome --network quickrun-esphome-net -p 6052:6052 ghcr.io/esphome/esphome:latest
    readyWhen: {http: 'http://localhost:6052'}
    open: true

stop:
  - run: docker rm -f quickrun-esphome
    continueOnError: true
  - run: docker network rm quickrun-esphome-net
    continueOnError: true
