# Generated by scripts/build-collection.mjs from AspireUI's container catalogue.
# Edit by hand only if you also remove this file from configs/GENERATED.
#
# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: ComfyUI
repository: Comfy-Org/ComfyUI
description: >-
  The most powerful and modular diffusion model GUI, api and backend with a graph/nodes
  interface. GPU recommended. Starts the official image (ghcr.io/ai-dock/comfyui:latest-cuda);
  nothing is stored, so stopping the run leaves nothing behind.
docs: 'https://github.com/comfyanonymous/ComfyUI'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-comfyui-net
    continueOnError: true

tasks:
  - name: comfyui
    run: docker run --rm --name quickrun-comfyui --network quickrun-comfyui-net -p 8188:8188 ghcr.io/ai-dock/comfyui:latest-cuda
    readyWhen: {http: 'http://localhost:8188'}
    open: true

stop:
  - run: docker rm -f quickrun-comfyui
    continueOnError: true
  - run: docker network rm quickrun-comfyui-net
    continueOnError: true
