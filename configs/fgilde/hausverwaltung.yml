# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: HaVeWa
repository: fgilde/hausverwaltung
description: >-
  HaVeWa — property management for rentals and German condominium associations (WEG) in one
  system: properties, units, people and meters, rental contracts with staggered and index
  rent, receivables with SEPA mandates and a three-stage dunning process, operating-cost
  statements per BetrKV with a flexible allocation-key engine and the 30/70 split of the
  HeizkostenV, camt.053 bank import plus DATEV and SEPA export. For WEG: co-ownership shares,
  business plan, annual statement, maintenance reserves, owners' meeting with resolution
  collection per §24 WEG, an owner self-service portal and the asset report. Plus calendar and
  deadlines, tickets, documents and an AI assistant. GDPR- and GoBD-oriented. Set SEED_DEMO to
  true for a demo dataset, or give the admin account below and log straight in. Starts the
  official image (ghcr.io/fgilde/hausverwaltung:latest); nothing is stored, so stopping the
  run leaves nothing behind.
docs: 'https://havewa.app'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-havewa-net
    continueOnError: true

tasks:
  - name: db
    run: docker run --rm --name quickrun-havewa-db --network quickrun-havewa-net postgres:16-alpine
  - name: havewa
    run: docker run --rm --name quickrun-havewa --network quickrun-havewa-net -p 3000:3000 -e AUTH_TRUST_HOST="true" -e DATABASE_URL="postgresql://havewa:havewa@quickrun-havewa-db:5432/havewa?schema=public" ghcr.io/fgilde/hausverwaltung:latest
    dependsOn: [db]
    readyWhen: {http: 'http://localhost:3000'}
    open: true

stop:
  - run: docker rm -f quickrun-havewa-db
    continueOnError: true
  - run: docker rm -f quickrun-havewa
    continueOnError: true
  - run: docker network rm quickrun-havewa-net
    continueOnError: true
