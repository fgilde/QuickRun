version: 1
name: Memos
repository: usememos/memos
description: >-
  Memos — lightweight, privacy-first note/memo hub. Starts the official image
  (neosmemo/memos:stable); nothing is stored, so stopping the run leaves nothing behind.
docs: 'https://www.usememos.com'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-memos-net
    continueOnError: true

tasks:
  - name: memos
    run: docker run --rm --name quickrun-memos --network quickrun-memos-net -p 5230:5230 neosmemo/memos:stable
    readyWhen: {http: 'http://localhost:5230'}
    open: true

stop:
  - run: docker rm -f quickrun-memos
    continueOnError: true
  - run: docker network rm quickrun-memos-net
    continueOnError: true
