# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: FlareSolverr
repository: FlareSolverr/FlareSolverr
description: >-
  Proxy server to bypass Cloudflare protection Starts the official image
  (ghcr.io/flaresolverr/flaresolverr:latest); nothing is stored, so stopping the run leaves
  nothing behind.
docs: 'https://github.com/FlareSolverr/FlareSolverr'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-flaresolverr-net
    continueOnError: true

tasks:
  - name: flaresolverr
    run: docker run --rm --name quickrun-flaresolverr --network quickrun-flaresolverr-net -p 8191:8191 ghcr.io/flaresolverr/flaresolverr:latest
    readyWhen: {http: 'http://localhost:8191'}
    open: true

stop:
  - run: docker rm -f quickrun-flaresolverr
    continueOnError: true
  - run: docker network rm quickrun-flaresolverr-net
    continueOnError: true
