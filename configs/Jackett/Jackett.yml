# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Jackett
repository: Jackett/Jackett
description: >-
  Jackett — indexer proxy that translates tracker searches for the *arr apps. Starts the
  official image (lscr.io/linuxserver/jackett:latest); nothing is stored, so stopping the run
  leaves nothing behind.
docs: 'https://github.com/Jackett/Jackett'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-jackett-net
    continueOnError: true

tasks:
  - name: jackett
    run: docker run --rm --name quickrun-jackett --network quickrun-jackett-net -p 9117:9117 lscr.io/linuxserver/jackett:latest
    readyWhen: {http: 'http://localhost:9117'}
    open: true

stop:
  - run: docker rm -f quickrun-jackett
    continueOnError: true
  - run: docker network rm quickrun-jackett-net
    continueOnError: true
