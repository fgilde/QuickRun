# Edit by hand only if you also remove this file from configs/GENERATED.
#
# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Drupal
repository: drupal/drupal
description: >-
  Drupal — PHP CMS/framework for structured content (official Apache image). Comes with a
  Postgres companion; the browser installer asks for the database — host drupal-db,
  name/user/password all "drupal". Starts the official image (drupal:latest); nothing is
  stored, so stopping the run leaves nothing behind.
docs: 'https://www.drupal.org'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-drupal-net
    continueOnError: true

tasks:
  - name: db
    run: docker run --rm --name quickrun-drupal-db --network quickrun-drupal-net -e POSTGRES_DB="drupal" -e POSTGRES_USER="drupal" -e POSTGRES_PASSWORD="drupal" postgres:16
    readyWhen: {log: database system is ready to accept connections}
  - name: drupal
    run: docker run --rm --name quickrun-drupal --network quickrun-drupal-net -p 80:80 drupal:latest
    dependsOn: [db]
    readyWhen: {http: 'http://localhost:80'}
    open: true

stop:
  - run: docker rm -f quickrun-drupal-db
    continueOnError: true
  - run: docker rm -f quickrun-drupal
    continueOnError: true
  - run: docker network rm quickrun-drupal-net
    continueOnError: true
