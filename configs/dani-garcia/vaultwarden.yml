version: 1
name: Vaultwarden
repository: dani-garcia/vaultwarden
description: >-
  Vaultwarden — lightweight Bitwarden-compatible password manager server. Starts the official
  image (vaultwarden/server:latest); nothing is stored, so stopping the run leaves nothing
  behind.
docs: 'https://github.com/dani-garcia/vaultwarden'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-vaultwarden-net
    continueOnError: true

tasks:
  - name: vaultwarden
    run: docker run --rm --name quickrun-vaultwarden --network quickrun-vaultwarden-net -p 80:80 vaultwarden/server:latest
    readyWhen: {http: 'http://localhost:80'}
    open: true

stop:
  - run: docker rm -f quickrun-vaultwarden
    continueOnError: true
  - run: docker network rm quickrun-vaultwarden-net
    continueOnError: true
