# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Baikal
repository: sabre-io/Baikal
description: >-
  Baïkal is a Calendar+Contacts server Finish setup (admin + SQLite/MySQL) via the web
  installer on first visit. Starts the official image (ckulka/baikal:nginx); nothing is
  stored, so stopping the run leaves nothing behind.
docs: 'https://sabre.io/baikal/'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-baikal-net
    continueOnError: true

tasks:
  - name: baikal
    run: docker run --rm --name quickrun-baikal --network quickrun-baikal-net -p 80:80 ckulka/baikal:nginx
    readyWhen: {http: 'http://localhost:80'}
    open: true

stop:
  - run: docker rm -f quickrun-baikal
    continueOnError: true
  - run: docker network rm quickrun-baikal-net
    continueOnError: true
