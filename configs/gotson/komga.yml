version: 1
name: Komga
repository: gotson/komga
description: >-
  Komga — self-hosted comics/manga/e-book server. Starts the official image
  (gotson/komga:latest); nothing is stored, so stopping the run leaves nothing behind.
docs: 'https://komga.org'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-komga-net
    continueOnError: true

tasks:
  - name: komga
    run: docker run --rm --name quickrun-komga --network quickrun-komga-net -p 25600:25600 gotson/komga:latest
    readyWhen: {http: 'http://localhost:25600'}
    open: true

stop:
  - run: docker rm -f quickrun-komga
    continueOnError: true
  - run: docker network rm quickrun-komga-net
    continueOnError: true
