# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: LX Family Planner
repository: laxxx-lab/lx-family-planner
description: >-
  LX Family — self-hosted "Family OS": calendars, chores, meal and shopping planning, chat,
  cloud files and child-friendly profiles. The first family is created in the browser after
  install; further registration stays closed. Starts the official image
  (ghcr.io/laxxx-lab/lx-family-planner:latest); nothing is stored, so stopping the run leaves
  nothing behind.
docs: 'https://github.com/laxxx-lab/lx-family-planner'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-lx-family-planner-net
    continueOnError: true

tasks:
  - name: lx-family-planner
    run: docker run --rm --name quickrun-lx-family-planner --network quickrun-lx-family-planner-net -p 3001:3001 -e NODE_ENV=production -e PORT=3001 -e TZ=Europe/Berlin -e SESSION_COOKIE_SECURE=auto -e REGISTRATION_MODE=first-family -e DATABASE_FILE=/app/data/family_planner.sqlite -e LEGACY_DATABASE_FILE=/app/data/family_db.json ghcr.io/laxxx-lab/lx-family-planner:latest
    readyWhen: {http: 'http://localhost:3001'}
    open: true

stop:
  - run: docker rm -f quickrun-lx-family-planner
    continueOnError: true
  - run: docker network rm quickrun-lx-family-planner-net
    continueOnError: true
