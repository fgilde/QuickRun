version: 1
name: PearCircle Seeder
repository: pearcircle/seeder
description: >-
  Run a blind seeder for your PearCircle circles on your Umbrel so their history stays in sync
  even when every phone is offline. ... PearCircle is a peer-to-peer location-sharing app with
  no accounts and no servers: a circle's data lives only on its members' devices and syncs
  directly between them. That means a circle is only reachable while at least one member's
  phone is online. This app runs the PearCircle… Starts the official image
  (ghcr.io/peerloomllc/pearcircle-seeder:1.0.23); nothing is stored, so stopping the run
  leaves nothing behind.
docs: 'https://github.com/peerloomllc/pearcircle-seeder'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-pearcircle-seeder-net
    continueOnError: true

tasks:
  - name: pearcircle-seeder
    run: docker run --rm --name quickrun-pearcircle-seeder --network quickrun-pearcircle-seeder-net -p 8730:8730 -e SEEDER_HOST="0.0.0.0" -e SEEDER_PORT="8730" -e SEEDER_NO_AUTH="1" -e SEEDER_NO_UPDATE_CHECK="1" ghcr.io/peerloomllc/pearcircle-seeder:1.0.23
    readyWhen: {http: 'http://localhost:8730'}
    open: true

stop:
  - run: docker rm -f quickrun-pearcircle-seeder
    continueOnError: true
  - run: docker network rm quickrun-pearcircle-seeder-net
    continueOnError: true
