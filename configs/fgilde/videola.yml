version: 1
name: Videola
repository: fgilde/videola
description: >-
  Videola — a browser-based video editor on a Rust core: import, cut and trim on the timeline,
  effects, transitions, masks, keyframes, colour scopes, an audio mixing desk with EBU R128
  loudness, subtitles and export. Works on desktop, tablet and phone, and ships an HTTP API
  plus an MCP server for agents. The editor opens without a login; the API and the server-side
  storage root need the access token below. Starts the official image
  (ghcr.io/fgilde/videola:latest); nothing is stored, so stopping the run leaves nothing
  behind.
docs: 'https://fgilde.github.io/videola/'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-videola-net
    continueOnError: true

tasks:
  - name: videola
    run: docker run --rm --name quickrun-videola --network quickrun-videola-net -p 7331:7331 ghcr.io/fgilde/videola:latest
    readyWhen: {http: 'http://localhost:7331'}
    open: true

stop:
  - run: docker rm -f quickrun-videola
    continueOnError: true
  - run: docker network rm quickrun-videola-net
    continueOnError: true
