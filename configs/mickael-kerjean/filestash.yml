version: 1
name: Filestash
repository: mickael-kerjean/filestash
description: >-
  :file_folder: Universal File Storage Client Starts the official image
  (machines/filestash:latest); nothing is stored, so stopping the run leaves nothing behind.
docs: 'https://www.filestash.app'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-filestash-net
    continueOnError: true

tasks:
  - name: filestash
    run: docker run --rm --name quickrun-filestash --network quickrun-filestash-net -p 8334:8334 machines/filestash:latest
    readyWhen: {http: 'http://localhost:8334'}
    open: true

stop:
  - run: docker rm -f quickrun-filestash
    continueOnError: true
  - run: docker network rm quickrun-filestash-net
    continueOnError: true
