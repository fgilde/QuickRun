# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Gokapi
repository: Forceu/Gokapi
description: >-
  Lightweight selfhosted Firefox Send alternative without public upload. AWS S3 supported.
  Starts the official image (f0rc3/gokapi:latest); nothing is stored, so stopping the run
  leaves nothing behind.
docs: 'https://github.com/Forceu/Gokapi'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-gokapi-net
    continueOnError: true

tasks:
  - name: gokapi
    run: docker run --rm --name quickrun-gokapi --network quickrun-gokapi-net -p 53842:53842 f0rc3/gokapi:latest
    readyWhen: {http: 'http://localhost:53842'}
    open: true

stop:
  - run: docker rm -f quickrun-gokapi
    continueOnError: true
  - run: docker network rm quickrun-gokapi-net
    continueOnError: true
