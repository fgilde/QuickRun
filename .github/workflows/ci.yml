name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore
      - run: dotnet test --no-build --verbosity normal

      # Changed configs only, against the build above: a typo in a config is found in seconds, and a
      # push that touches no config costs nothing. Running them is configs-smoke.yml's job.
      - name: Changed configs are valid
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node --test scripts/config-status.test.mjs
          git fetch --quiet --depth=1 origin "$BASE" 2>/dev/null || true
          changed=$(git diff --name-only --diff-filter=AM "$BASE" HEAD -- 'configs/*.yml' 2>/dev/null) \
            || changed=$(git ls-files 'configs/*.yml')
          if [ -z "$changed" ]; then echo "no config changed"; exit 0; fi
          for file in $changed; do
            dotnet run --project src/QuickRun.App --no-build -- validate "$file"
          done

      - name: Site builds and carries no page-wide styles
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cd site
          npm ci || npm install
          npx vitepress build
          node check-build.mjs

      # A syntax error in a shipped page is invisible until somebody opens it, and then the window
      # draws and does nothing. Seconds, no browser.
      - name: Pages parse
        shell: bash
        run: node scripts/check-pages.mjs

      - name: Extension builds for both targets
        shell: bash
        run: |
          cd extension
          sh build.sh 0.0.0-ci
          test -f dist/quickrun-chromium-0.0.0-ci.zip
          test -f dist/quickrun-firefox-0.0.0-ci.zip

      - name: Extension tests
        shell: bash
        run: node --test extension/test/*.test.js

      # The confirmation window, actually loaded in a browser with a real plan. A page that throws
      # while drawing fails silently - the exception goes to a console nobody has open, the window
      # looks merely empty, and the buttons do nothing because the module never bound them. That
      # shipped once; nothing but running the page catches it.
      - name: Confirmation window renders and its buttons work
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: node scripts/drive-confirm.mjs extension/test/fixtures/plan.json

      # The embeddable button, pressed in a real browser against a fake daemon. Every branch of a
      # click is a security decision - the window, the scheme, or the download page - and none of
      # them is visible in the file.
      - name: The web components work
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: node scripts/drive-components.mjs

      # And QuickRun's own window: every tab has to open, and it has to say where it is listening.
      - name: The window works
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          dotnet build src/QuickRun.App -c Debug
          node scripts/drive-dashboard.mjs
