# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Monica
repository: monicahq/monica
description: >-
  Monica — a personal CRM: remember everything about your friends and family. MariaDB
  companion included; APP_KEY is generated for you (32 chars, keep it stable), then register
  the first account in the browser. Starts the official image (monica:apache); nothing is
  stored, so stopping the run leaves nothing behind.
docs: 'https://www.monicahq.com'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-monica-net
    continueOnError: true

tasks:
  - name: db
    run: docker run --rm --name quickrun-monica-db --network quickrun-monica-net -e MYSQL_ROOT_PASSWORD=monica -e MYSQL_DATABASE=monica -e MYSQL_USER=monica -e MYSQL_PASSWORD=monica lscr.io/linuxserver/mariadb:latest
    readyWhen: {log: ready for connections}
  - name: monica
    run: docker run --rm --name quickrun-monica --network quickrun-monica-net -p 80:80 -e DB_HOST=quickrun-monica-db -e DB_PORT=3306 -e DB_DATABASE=monica -e DB_USERNAME=monica -e DB_PASSWORD=monica monica:apache
    dependsOn: [db]
    readyWhen: {http: 'http://localhost:80'}
    open: true

stop:
  - run: docker rm -f quickrun-monica-db
    continueOnError: true
  - run: docker rm -f quickrun-monica
    continueOnError: true
  - run: docker network rm quickrun-monica-net
    continueOnError: true
