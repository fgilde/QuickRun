# Generated by scripts/build-collection.mjs from AspireUI's container catalogue.
# Edit by hand only if you also remove this file from configs/GENERATED.
#
# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Immich
repository: immich-app/immich
description: >-
  Immich — self-hosted photo & video backup. Comes with Immich's VectorChord Postgres + Redis
  + the ML container (scaffold — add a media library volume as needed). Starts the official
  image (ghcr.io/immich-app/immich-server:release); nothing is stored, so stopping the run
  leaves nothing behind.
docs: 'https://immich.app'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-immich-net
    continueOnError: true

tasks:
  - name: db
    run: docker run --rm --name quickrun-immich-db --network quickrun-immich-net -e POSTGRES_DB=immich -e POSTGRES_USER=immich -e POSTGRES_PASSWORD=immich ghcr.io/immich-app/postgres:16-vectorchord0.3.0
    readyWhen: {log: database system is ready to accept connections}
  - name: redis
    run: docker run --rm --name quickrun-immich-redis --network quickrun-immich-net -p 6379:6379 redis:7
    readyWhen: {log: Ready to accept connections}
  - name: ml
    run: docker run --rm --name quickrun-immich-ml --network quickrun-immich-net -p 3003:3003 ghcr.io/immich-app/immich-machine-learning:release
    readyWhen: {port: 3003}
  - name: immich
    run: docker run --rm --name quickrun-immich --network quickrun-immich-net -p 2283:2283 -e DB_HOSTNAME=quickrun-immich-db -e DB_USERNAME=immich -e DB_PASSWORD=immich -e DB_DATABASE_NAME=immich -e REDIS_HOSTNAME=quickrun-immich-redis ghcr.io/immich-app/immich-server:release
    dependsOn: [db, redis, ml]
    readyWhen: {http: 'http://localhost:2283'}
    open: true

stop:
  - run: docker rm -f quickrun-immich-db
    continueOnError: true
  - run: docker rm -f quickrun-immich-redis
    continueOnError: true
  - run: docker rm -f quickrun-immich-ml
    continueOnError: true
  - run: docker rm -f quickrun-immich
    continueOnError: true
  - run: docker network rm quickrun-immich-net
    continueOnError: true
