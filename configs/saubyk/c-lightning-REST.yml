# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Ride The Lightning
repository: saubyk/c-lightning-REST
description: >-
  RTL — web UI for LND / Core Lightning / Eclair nodes. Needs an existing LN node: mount its
  macaroon + point RTLConfig at the node. Starts the official image
  (shahanafarooqui/rtl:latest); nothing is stored, so stopping the run leaves nothing behind.
docs: 'https://github.com/Ride-The-Lightning/RTL'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-rtl-net
    continueOnError: true

tasks:
  - name: rtl
    run: docker run --rm --name quickrun-rtl --network quickrun-rtl-net -p 3000:3000 -e RTL_CONFIG_PATH=/RTLConfig shahanafarooqui/rtl:latest
    readyWhen: {http: 'http://localhost:3000'}
    open: true

stop:
  - run: docker rm -f quickrun-rtl
    continueOnError: true
  - run: docker network rm quickrun-rtl-net
    continueOnError: true
