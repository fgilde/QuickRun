# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: MinIO
repository: minio/minio
description: >-
  MinIO — S3-compatible object storage; console on :9001 (S3 API :9000). Pinned to the last
  release with a full browser console. Root user/password seeded as params (>= 8 chars).
  Starts the official image (minio/minio:RELEASE.2025-04-22T22-12-26Z); nothing is stored, so
  stopping the run leaves nothing behind.
docs: 'https://min.io'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-minio-net
    continueOnError: true

tasks:
  - name: minio
    run: docker run --rm --name quickrun-minio --network quickrun-minio-net -p 9001:9001 minio/minio:RELEASE.2025-04-22T22-12-26Z
    readyWhen: {http: 'http://localhost:9001'}
    open: true

stop:
  - run: docker rm -f quickrun-minio
    continueOnError: true
  - run: docker network rm quickrun-minio-net
    continueOnError: true
