# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: phpMyAdmin
repository: phpmyadmin/phpmyadmin
description: >-
  phpMyAdmin — the web UI for MySQL/MariaDB. Arbitrary-server mode is on, so you type the
  database host at login (e.g. another resource in your stack) instead of wiring it up front.
  Starts the official image (phpmyadmin:latest); nothing is stored, so stopping the run leaves
  nothing behind.
docs: 'https://www.phpmyadmin.net'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-phpmyadmin-net
    continueOnError: true

tasks:
  - name: phpmyadmin
    run: docker run --rm --name quickrun-phpmyadmin --network quickrun-phpmyadmin-net -p 80:80 -e PMA_ARBITRARY="1" -e UPLOAD_LIMIT="256M" phpmyadmin:latest
    readyWhen: {http: 'http://localhost:80'}
    open: true

stop:
  - run: docker rm -f quickrun-phpmyadmin
    continueOnError: true
  - run: docker network rm quickrun-phpmyadmin-net
    continueOnError: true
