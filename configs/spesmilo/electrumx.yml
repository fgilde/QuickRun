# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: ElectrumX
repository: spesmilo/electrumx
description: >-
  Server impl for Electrum Protocol, for public-facing or personal usage ElectrumX server
  (env-configurable). Requires an external Bitcoin Core node with txindex; set DAEMON_URL to
  its RPC. Starts the official image (lukechilds/electrumx:latest); nothing is stored, so
  stopping the run leaves nothing behind.
docs: 'https://github.com/lukechilds/docker-electrumx'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-electrumx-net
    continueOnError: true

tasks:
  - name: electrumx
    run: docker run --rm --name quickrun-electrumx --network quickrun-electrumx-net -p 50001:50001 -e COIN=Bitcoin -e NET=mainnet -e SERVICES=tcp://0.0.0.0:50001 lukechilds/electrumx:latest
    readyWhen: {http: 'http://localhost:50001'}
    open: true

stop:
  - run: docker rm -f quickrun-electrumx
    continueOnError: true
  - run: docker network rm quickrun-electrumx-net
    continueOnError: true
