# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Etherpad
repository: ether/etherpad
description: >-
  Etherpad: A modern really-real-time collaborative document editor. Admin UI (/admin) login
  admin + the seeded ADMIN_PASSWORD. Starts the official image (etherpad/etherpad:latest);
  nothing is stored, so stopping the run leaves nothing behind.
docs: 'https://etherpad.org'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-etherpad-net
    continueOnError: true

tasks:
  - name: etherpad
    run: docker run --rm --name quickrun-etherpad --network quickrun-etherpad-net -p 9001:9001 etherpad/etherpad:latest
    readyWhen: {http: 'http://localhost:9001'}
    open: true

stop:
  - run: docker rm -f quickrun-etherpad
    continueOnError: true
  - run: docker network rm quickrun-etherpad-net
    continueOnError: true
