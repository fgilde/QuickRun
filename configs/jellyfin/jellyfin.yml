version: 1
name: Jellyfin
repository: jellyfin/jellyfin
description: >-
  Jellyfin enables you to collect, manage, and stream your media. Run the Jellyfin server on
  your system and gain access to the leading free-software entertainment system, bells and
  whistles included. ... With a large array of official and third-party clients, Jellyfin is
  available on most popular platforms. Your media is ready to follow you, wherever you go. ...
  Jellyfin is Free Software, licensed under the GNU GPL.… Starts the official image
  (jellyfin/jellyfin:latest); nothing is stored, so stopping the run leaves nothing behind.
docs: 'https://jellyfin.org'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-jellyfin-net
    continueOnError: true

tasks:
  - name: jellyfin
    run: docker run --rm --name quickrun-jellyfin --network quickrun-jellyfin-net -p 8096:8096 jellyfin/jellyfin:latest
    readyWhen: {http: 'http://localhost:8096'}
    open: true

stop:
  - run: docker rm -f quickrun-jellyfin
    continueOnError: true
  - run: docker network rm quickrun-jellyfin-net
    continueOnError: true
