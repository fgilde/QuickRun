version: 1
name: Overseerr
repository: sct/overseerr
description: >-
  Overseerr — media request & discovery for Plex (Radarr/Sonarr integration). Starts the
  official image (sctx/overseerr:latest); nothing is stored, so stopping the run leaves
  nothing behind.
docs: 'https://overseerr.dev'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-overseerr-net
    continueOnError: true

tasks:
  - name: overseerr
    run: docker run --rm --name quickrun-overseerr --network quickrun-overseerr-net -p 5055:5055 sctx/overseerr:latest
    readyWhen: {http: 'http://localhost:5055'}
    open: true

stop:
  - run: docker rm -f quickrun-overseerr
    continueOnError: true
  - run: docker network rm quickrun-overseerr-net
    continueOnError: true
