name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore
      - run: dotnet test --no-build --verbosity normal

      - name: Site builds and carries no page-wide styles
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cd site
          npm ci || npm install
          npx vitepress build
          node check-build.mjs

      - name: Extension builds for both targets
        shell: bash
        run: |
          cd extension
          sh build.sh 0.0.0-ci
          test -f dist/quickrun-chromium-0.0.0-ci.zip
          test -f dist/quickrun-firefox-0.0.0-ci.zip

      - name: Extension tests
        shell: bash
        run: node --test extension/test/*.test.js

      # The confirmation window, actually loaded in a browser with a real plan. A page that throws
      # while drawing fails silently - the exception goes to a console nobody has open, the window
      # looks merely empty, and the buttons do nothing because the module never bound them. That
      # shipped once; nothing but running the page catches it.
      - name: Confirmation window renders and its buttons work
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: node scripts/drive-confirm.mjs extension/test/fixtures/plan.json
