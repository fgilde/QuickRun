version: 1
name: qBittorrent
repository: qbittorrent/qBittorrent
description: >-
  qBittorrent is a free, open-source BitTorrent client with a built-in web UI. It’s the most
  popular self-hosted torrent client — lightweight, feature-rich, and widely supported by the
  *arr stack (Sonarr, Radarr, Lidarr). qBittorrent replaces paid or ad-supported clients like
  uTorrent and BitTorrent, with better privacy and full control over your downloads. ...
  qBittorrent has a more feature-rich web UI, better *arr… Starts the official image
  (lscr.io/linuxserver/qbittorrent:latest); nothing is stored, so stopping the run leaves
  nothing behind.
docs: 'https://www.qbittorrent.org'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-qbittorrent-net
    continueOnError: true

tasks:
  - name: qbittorrent
    run: docker run --rm --name quickrun-qbittorrent --network quickrun-qbittorrent-net -p 8080:8080 -e WEBUI_PORT=8080 lscr.io/linuxserver/qbittorrent:latest
    readyWhen: {http: 'http://localhost:8080'}
    open: true

stop:
  - run: docker rm -f quickrun-qbittorrent
    continueOnError: true
  - run: docker network rm quickrun-qbittorrent-net
    continueOnError: true
