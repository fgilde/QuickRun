# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Homarr
repository: ajnart/homarr
description: >-
  Customizable browser's home page to interact with your homeserver's Docker containers (e.g.
  Sonarr/Radarr) Requires SECRET_ENCRYPTION_KEY (64 hex) or it exits — seeded as a parameter
  (rotating it invalidates stored integration secrets). Starts the official image
  (ghcr.io/homarr-labs/homarr:latest); nothing is stored, so stopping the run leaves nothing
  behind.
docs: 'https://homarr.dev'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-homarr-net
    continueOnError: true

tasks:
  - name: homarr
    run: docker run --rm --name quickrun-homarr --network quickrun-homarr-net -p 7575:7575 ghcr.io/homarr-labs/homarr:latest
    readyWhen: {http: 'http://localhost:7575'}
    open: true

stop:
  - run: docker rm -f quickrun-homarr
    continueOnError: true
  - run: docker network rm quickrun-homarr-net
    continueOnError: true
