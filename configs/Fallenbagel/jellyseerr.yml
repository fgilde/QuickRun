# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Jellyseerr
repository: Fallenbagel/jellyseerr
description: >-
  Jellyseerr — media request & discovery frontend for Jellyfin/Emby/Plex. Starts the official
  image (fallenbagel/jellyseerr:latest); nothing is stored, so stopping the run leaves nothing
  behind.
docs: 'https://github.com/Fallenbagel/jellyseerr'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-jellyseerr-net
    continueOnError: true

tasks:
  - name: jellyseerr
    run: docker run --rm --name quickrun-jellyseerr --network quickrun-jellyseerr-net -p 5055:5055 fallenbagel/jellyseerr:latest
    readyWhen: {http: 'http://localhost:5055'}
    open: true

stop:
  - run: docker rm -f quickrun-jellyseerr
    continueOnError: true
  - run: docker network rm quickrun-jellyseerr-net
    continueOnError: true
