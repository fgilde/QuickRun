# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: SD.Next
repository: vladmandic/automatic
description: >-
  SD.Next — all-in-one WebUI for generative image/video (vladmandic). CUDA image shown;
  ROCm/IPEX/OpenVINO variants exist. GPU recommended. Starts the official image
  (vladmandic/sdnext-cuda:latest); nothing is stored, so stopping the run leaves nothing
  behind.
docs: 'https://github.com/vladmandic/sdnext'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-sdnext-net
    continueOnError: true

tasks:
  - name: sdnext
    run: docker run --rm --name quickrun-sdnext --network quickrun-sdnext-net -p 7860:7860 vladmandic/sdnext-cuda:latest
    readyWhen: {http: 'http://localhost:7860'}
    open: true

stop:
  - run: docker rm -f quickrun-sdnext
    continueOnError: true
  - run: docker network rm quickrun-sdnext-net
    continueOnError: true
