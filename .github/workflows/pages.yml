name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'samples/**'
      - 'schema/**'
      - 'scripts/install.sh'
      - 'quickrun.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

  # A release publishes new package manifests, and this workflow is what copies them onto the site -
  # so the site served 0.7.10 while 0.7.12 was out, and `brew install <site url>` installed the old
  # one. The release cannot announce itself here by publishing: an event raised with GITHUB_TOKEN
  # never starts another workflow run. workflow_run is not subject to that rule.
  workflow_run:
    workflows: [release]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A failed release has nothing worth staging.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        working-directory: site
        run: npm ci || npm install

      # Published so that the schema comment in every sample resolves, and so scoop can install
      # from a URL without a separate bucket repository.
      - name: Stage published files
        run: |
          # site/public holds only generated files, so git does not track the directory itself.
          mkdir -p site/public
          cp schema/quickrun.schema.json site/public/quickrun.schema.json
          cp scripts/install.sh site/public/install.sh
          cp assets/icon.png site/public/icon.png
          cp assets/logo.png site/public/logo.png
          cp assets/logo-dark.png site/public/logo-dark.png

      # Served from the site so scoop and Homebrew can install from a URL, with no separate bucket
      # or tap repository. Fetched from the release rather than committed, so they cannot go stale.
      - name: Stage package manifests from the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for manifest in quickrun.json quickrun.rb quickrun-cask.rb; do
            if gh release download --repo "$GITHUB_REPOSITORY" --pattern "$manifest"                  --dir site/public --clobber; then
              echo "staged $manifest"
            else
              echo "no $manifest in the latest release yet - skipping"
            fi
          done

      - name: Build
        working-directory: site
        run: npx vitepress build

      - name: Check the built CSS
        working-directory: site
        run: node check-build.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
