# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Bitcoin Cash Node
repository: bitcoin-cash-node/bitcoin-cash-node
description: >-
  This is a mirror of the official Bitcoin Cash Node repository. Please see README.md
  https://gitlab.com/bitcoin-cash-node/bitcoin-cash-node Starts the official image
  (zquestz/bitcoin-cash-node:latest); nothing is stored, so stopping the run leaves nothing
  behind.
docs: 'https://bitcoincashnode.org'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-bitcoin-cash-node-net
    continueOnError: true

tasks:
  - name: bitcoin-cash-node
    run: docker run --rm --name quickrun-bitcoin-cash-node --network quickrun-bitcoin-cash-node-net -p 8332:8332 zquestz/bitcoin-cash-node:latest
    readyWhen: {http: 'http://localhost:8332'}
    open: true

stop:
  - run: docker rm -f quickrun-bitcoin-cash-node
    continueOnError: true
  - run: docker network rm quickrun-bitcoin-cash-node-net
    continueOnError: true
