version: 1
name: Gotify
repository: gotify/server
description: >-
  A simple server for sending and receiving messages in real-time per WebSocket. (Includes a
  sleek web-ui) Gotify — simple self-hosted server for push notifications (login admin /
  admin, change it). Starts the official image (gotify/server:latest); nothing is stored, so
  stopping the run leaves nothing behind.
docs: 'https://gotify.net'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-gotify-net
    continueOnError: true

tasks:
  - name: gotify
    run: docker run --rm --name quickrun-gotify --network quickrun-gotify-net -p 80:80 gotify/server:latest
    readyWhen: {http: 'http://localhost:80'}
    open: true

stop:
  - run: docker rm -f quickrun-gotify
    continueOnError: true
  - run: docker network rm quickrun-gotify-net
    continueOnError: true
