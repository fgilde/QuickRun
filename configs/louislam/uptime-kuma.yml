# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Uptime Kuma
repository: louislam/uptime-kuma
description: >-
  Uptime Kuma — self-hosted uptime/status monitoring. Starts the official image
  (louislam/uptime-kuma:1); nothing is stored, so stopping the run leaves nothing behind.
docs: 'https://github.com/louislam/uptime-kuma'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-uptime-kuma-net
    continueOnError: true

tasks:
  - name: uptime-kuma
    run: docker run --rm --name quickrun-uptime-kuma --network quickrun-uptime-kuma-net -p 3001:3001 louislam/uptime-kuma:1
    readyWhen: {http: 'http://localhost:3001'}
    open: true

stop:
  - run: docker rm -f quickrun-uptime-kuma
    continueOnError: true
  - run: docker network rm quickrun-uptime-kuma-net
    continueOnError: true
