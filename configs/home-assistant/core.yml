# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Home Assistant
repository: home-assistant/core
description: >-
  :house_with_garden: Open source home automation that puts local control and privacy first.
  Starts the official image (ghcr.io/home-assistant/home-assistant:stable); nothing is stored,
  so stopping the run leaves nothing behind.
docs: 'https://www.home-assistant.io'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-homeassistant-net
    continueOnError: true

tasks:
  - name: homeassistant
    run: docker run --rm --name quickrun-homeassistant --network quickrun-homeassistant-net -p 8123:8123 ghcr.io/home-assistant/home-assistant:stable
    readyWhen: {http: 'http://localhost:8123'}
    open: true

stop:
  - run: docker rm -f quickrun-homeassistant
    continueOnError: true
  - run: docker network rm quickrun-homeassistant-net
    continueOnError: true
