# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: LobeChat
repository: lobehub/lobe-chat
description: >-
  LobeChat — polished chat UI for OpenAI/Claude/Ollama and more (enter your API keys in-app).
  Starts the official image (lobehub/lobe-chat:latest); nothing is stored, so stopping the run
  leaves nothing behind.
docs: 'https://lobehub.com'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-lobe-chat-net
    continueOnError: true

tasks:
  - name: lobe-chat
    run: docker run --rm --name quickrun-lobe-chat --network quickrun-lobe-chat-net -p 3210:3210 lobehub/lobe-chat:latest
    readyWhen: {http: 'http://localhost:3210'}
    open: true

stop:
  - run: docker rm -f quickrun-lobe-chat
    continueOnError: true
  - run: docker network rm quickrun-lobe-chat-net
    continueOnError: true
