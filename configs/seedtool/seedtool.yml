version: 1
name: Bitcoin Seed Tool
repository: seedtool/seedtool
description: >-
  # Bitcoin Seed Tool ... This tool offers a space for bitcoiners to experiment and learn how
  bitcoin wallets are generated using different sources of entropy (randomness). The page also
  offers many other seed related functionalites, some of which are outlined below. The online
  version can be found at https://bitcoiner.guide/seed. ... NEVER use the online version of
  this tool to create or interact with seeds used to… Starts the official image
  (dennysubke/seedtool:2.3.0); nothing is stored, so stopping the run leaves nothing behind.
docs: 'https://github.com/dennysubke/seedtool-web'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-seedtool-net
    continueOnError: true

tasks:
  - name: seedtool
    run: docker run --rm --name quickrun-seedtool --network quickrun-seedtool-net -p 8080:8080 dennysubke/seedtool:2.3.0
    readyWhen: {http: 'http://localhost:8080'}
    open: true

stop:
  - run: docker rm -f quickrun-seedtool
    continueOnError: true
  - run: docker network rm quickrun-seedtool-net
    continueOnError: true
