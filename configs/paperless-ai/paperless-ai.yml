# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Paperless-AI
repository: paperless-ai/paperless-ai
description: >-
  Paperless-AI — AI companion for Paperless-ngx: auto tagging/classification + semantic
  search. Point it at your Paperless instance. Starts the official image
  (clusterzx/paperless-ai:latest); nothing is stored, so stopping the run leaves nothing
  behind.
docs: 'https://github.com/clusterzx/paperless-ai'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-paperless-ai-net
    continueOnError: true

tasks:
  - name: paperless-ai
    run: docker run --rm --name quickrun-paperless-ai --network quickrun-paperless-ai-net -p 3000:3000 clusterzx/paperless-ai:latest
    readyWhen: {http: 'http://localhost:3000'}
    open: true

stop:
  - run: docker rm -f quickrun-paperless-ai
    continueOnError: true
  - run: docker network rm quickrun-paperless-ai-net
    continueOnError: true
