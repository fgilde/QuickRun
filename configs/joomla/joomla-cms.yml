# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Joomla
repository: joomla/joomla-cms
description: >-
  Joomla — PHP CMS for sites and portals (official Apache image). MariaDB companion included;
  fill in the admin account below and the installer runs unattended on first start. Starts the
  official image (joomla:latest); nothing is stored, so stopping the run leaves nothing
  behind.
docs: 'https://www.joomla.org'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-joomla-net
    continueOnError: true

tasks:
  - name: db
    run: docker run --rm --name quickrun-joomla-db --network quickrun-joomla-net lscr.io/linuxserver/mariadb:latest
  - name: joomla
    run: docker run --rm --name quickrun-joomla --network quickrun-joomla-net -p 80:80 -e JOOMLA_DB_HOST="quickrun-joomla-db" -e JOOMLA_DB_NAME="joomla" -e JOOMLA_DB_USER="joomla" -e JOOMLA_DB_PASSWORD="joomla" -e JOOMLA_SITE_NAME="Joomla" -e JOOMLA_ADMIN_USER="Administrator" -e JOOMLA_ADMIN_USERNAME="admin" -e JOOMLA_ADMIN_EMAIL="admin@example.com" joomla:latest
    dependsOn: [db]
    readyWhen: {http: 'http://localhost:80'}
    open: true

stop:
  - run: docker rm -f quickrun-joomla-db
    continueOnError: true
  - run: docker rm -f quickrun-joomla
    continueOnError: true
  - run: docker network rm quickrun-joomla-net
    continueOnError: true
