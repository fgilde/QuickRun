# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: SkyBro
repository: skybro/skybro
description: >-
  SkyBro — overhead flight tracker with alerts (uses OpenSky/Open-Meteo, no API key). Ships a
  tracker companion; both share /data on Umbrel — our companion can't share the volume yet, so
  the dashboard may show empty until that's wired. Home coords + Pushover/Discord set in-app.
  Starts the official image (xdeekay/skybro-dashboard:1.5.7); nothing is stored, so stopping
  the run leaves nothing behind.
docs: 'https://github.com/xdeekay/skybro'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-skybro-net
    continueOnError: true

tasks:
  - name: tracker
    run: docker run --rm --name quickrun-skybro-tracker --network quickrun-skybro-net xdeekay/skybro-tracker:1.5.7
    readyWhen: {delay: 5s}
  - name: skybro
    run: docker run --rm --name quickrun-skybro --network quickrun-skybro-net -p 5000:5000 xdeekay/skybro-dashboard:1.5.7
    dependsOn: [tracker]
    readyWhen: {http: 'http://localhost:5000'}
    open: true

stop:
  - run: docker rm -f quickrun-skybro-tracker
    continueOnError: true
  - run: docker rm -f quickrun-skybro
    continueOnError: true
  - run: docker network rm quickrun-skybro-net
    continueOnError: true
