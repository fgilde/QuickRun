# Generated by scripts/build-collection.mjs from AspireUI's container catalogue.
# Edit by hand only if you also remove this file from configs/GENERATED.
#
# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Kimai
repository: kimai/kimai
description: >-
  Kimai — self-hosted time tracking for teams and freelancers. MariaDB companion included; the
  first admin account is created from the mail address and password below. Starts the official
  image (kimai/kimai2:apache); nothing is stored, so stopping the run leaves nothing behind.
docs: 'https://www.kimai.org'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-kimai-net
    continueOnError: true

tasks:
  - name: db
    run: docker run --rm --name quickrun-kimai-db --network quickrun-kimai-net -e MYSQL_ROOT_PASSWORD=kimai -e MYSQL_DATABASE=kimai -e MYSQL_USER=kimai -e MYSQL_PASSWORD=kimai lscr.io/linuxserver/mariadb:latest
    readyWhen: {log: ready for connections}
  - name: kimai
    run: docker run --rm --name quickrun-kimai --network quickrun-kimai-net -p 8001:8001 -e DATABASE_URL="mysql://kimai:kimai@quickrun-kimai-db:3306/kimai?charset=utf8mb4&serverVersion=10.11.0-MariaDB" -e ADMINMAIL=admin@example.com -e TRUSTED_HOSTS=localhost kimai/kimai2:apache
    dependsOn: [db]
    readyWhen: {http: 'http://localhost:8001'}
    open: true

stop:
  - run: docker rm -f quickrun-kimai-db
    continueOnError: true
  - run: docker rm -f quickrun-kimai
    continueOnError: true
  - run: docker network rm quickrun-kimai-net
    continueOnError: true
