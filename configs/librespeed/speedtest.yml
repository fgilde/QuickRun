# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: LibreSpeed
repository: librespeed/speedtest
description: >-
  LibreSpeed — self-hosted network speed test (no Flash/Java, single container). Starts the
  official image (lscr.io/linuxserver/librespeed:latest); nothing is stored, so stopping the
  run leaves nothing behind.
docs: 'https://librespeed.org'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-librespeed-net
    continueOnError: true

tasks:
  - name: librespeed
    run: docker run --rm --name quickrun-librespeed --network quickrun-librespeed-net -p 80:80 lscr.io/linuxserver/librespeed:latest
    readyWhen: {http: 'http://localhost:80'}
    open: true

stop:
  - run: docker rm -f quickrun-librespeed
    continueOnError: true
  - run: docker network rm quickrun-librespeed-net
    continueOnError: true
