# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: flatnotes
repository: dullage/flatnotes
description: >-
  flatnotes — database-less markdown notes over a flat folder. Username/password + session
  secret seeded as params. Starts the official image (dullage/flatnotes:latest); nothing is
  stored, so stopping the run leaves nothing behind.
docs: 'https://github.com/dullage/flatnotes'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-flatnotes-net
    continueOnError: true

tasks:
  - name: flatnotes
    run: docker run --rm --name quickrun-flatnotes --network quickrun-flatnotes-net -p 8080:8080 -e FLATNOTES_AUTH_TYPE="password" dullage/flatnotes:latest
    readyWhen: {http: 'http://localhost:8080'}
    open: true

stop:
  - run: docker rm -f quickrun-flatnotes
    continueOnError: true
  - run: docker network rm quickrun-flatnotes-net
    continueOnError: true
