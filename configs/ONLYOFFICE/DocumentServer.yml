version: 1
name: OnlyOffice
repository: ONLYOFFICE/DocumentServer
description: >-
  I believe this is just a description based on the fact, that ONLYOFFICE Docs is a web-based
  application. Therefore it has to be “hosted” on a machine (PC) and can then also be accessed
  and used from other PCs via web-browser, either from outside and/or inside a
  network-environment, depending on the configuration of the host/network … As in comparison
  to ONLYOFFICE Destktop installations. ... Firstly, Desktop… Starts the official image
  (onlyoffice/documentserver:latest); nothing is stored, so stopping the run leaves nothing
  behind.
docs: 'https://www.onlyoffice.com'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-onlyoffice-net
    continueOnError: true

tasks:
  - name: onlyoffice
    run: docker run --rm --name quickrun-onlyoffice --network quickrun-onlyoffice-net -p 80:80 onlyoffice/documentserver:latest
    readyWhen: {http: 'http://localhost:80'}
    open: true

stop:
  - run: docker rm -f quickrun-onlyoffice
    continueOnError: true
  - run: docker network rm quickrun-onlyoffice-net
    continueOnError: true
