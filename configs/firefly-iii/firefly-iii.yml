# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Firefly III
repository: firefly-iii/firefly-iii
description: >-
  Firefly III — self-hosted personal finance manager. Comes with a Postgres companion. APP_KEY
  must stay exactly 32 chars. Starts the official image (fireflyiii/core:latest); nothing is
  stored, so stopping the run leaves nothing behind.
docs: 'https://www.firefly-iii.org'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-firefly-iii-net
    continueOnError: true

tasks:
  - name: db
    run: docker run --rm --name quickrun-firefly-iii-db --network quickrun-firefly-iii-net -e POSTGRES_DB=firefly -e POSTGRES_USER=firefly -e POSTGRES_PASSWORD=firefly postgres:16
    readyWhen: {log: database system is ready to accept connections}
  - name: firefly-iii
    run: docker run --rm --name quickrun-firefly-iii --network quickrun-firefly-iii-net -p 8080:8080 -e DB_CONNECTION=pgsql -e DB_HOST=quickrun-firefly-iii-db -e DB_PORT=5432 -e DB_DATABASE=firefly -e DB_USERNAME=firefly -e DB_PASSWORD=firefly fireflyiii/core:latest
    dependsOn: [db]
    readyWhen: {http: 'http://localhost:8080'}
    open: true

stop:
  - run: docker rm -f quickrun-firefly-iii-db
    continueOnError: true
  - run: docker rm -f quickrun-firefly-iii
    continueOnError: true
  - run: docker network rm quickrun-firefly-iii-net
    continueOnError: true
