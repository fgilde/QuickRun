version: 1
name: File Browser
repository: filebrowser/filebrowser
description: >-
  📂 Web File Browser File Browser — a tidy web file manager for a directory (login admin /
  admin, change it). Starts the official image (filebrowser/filebrowser:latest); nothing is
  stored, so stopping the run leaves nothing behind.
docs: 'https://filebrowser.org'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-filebrowser-net
    continueOnError: true

tasks:
  - name: filebrowser
    run: docker run --rm --name quickrun-filebrowser --network quickrun-filebrowser-net -p 80:80 filebrowser/filebrowser:latest
    readyWhen: {http: 'http://localhost:80'}
    open: true

stop:
  - run: docker rm -f quickrun-filebrowser
    continueOnError: true
  - run: docker network rm quickrun-filebrowser-net
    continueOnError: true
