# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: mempool
repository: mempool/mempool
description: >-
  mempool.space self-hosted explorer/visualizer. Frontend + backend + MariaDB. Point the
  backend at an external Bitcoin Core (CORE_RPC_*) and Electrum server (ELECTRUM_HOST). Starts
  the official image (mempool/frontend:latest); nothing is stored, so stopping the run leaves
  nothing behind.
docs: 'https://github.com/mempool/mempool'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-mempool-net
    continueOnError: true

tasks:
  - name: backend
    run: docker run --rm --name quickrun-mempool-backend --network quickrun-mempool-net -p 8999:8999 mempool/backend:latest
    readyWhen: {port: 8999}
  - name: db
    run: docker run --rm --name quickrun-mempool-db --network quickrun-mempool-net -p 3306:3306 mariadb:10.11
    readyWhen: {port: 3306}
  - name: mempool
    run: docker run --rm --name quickrun-mempool --network quickrun-mempool-net -p 8080:8080 -e FRONTEND_HTTP_PORT="8080" -e BACKEND_MAINNET_HTTP_HOST="quickrun-mempool-backend" mempool/frontend:latest
    dependsOn: [backend, db]
    readyWhen: {http: 'http://localhost:8080'}
    open: true

stop:
  - run: docker rm -f quickrun-mempool-backend
    continueOnError: true
  - run: docker rm -f quickrun-mempool-db
    continueOnError: true
  - run: docker rm -f quickrun-mempool
    continueOnError: true
  - run: docker network rm quickrun-mempool-net
    continueOnError: true
