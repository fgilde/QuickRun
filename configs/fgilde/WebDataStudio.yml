# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: WebDataStudio
repository: fgilde/WebDataStudio
description: >-
  WebDataStudio — a database studio that runs in the browser: PostgreSQL, MySQL/MariaDB, SQL
  Server, SQLite, Oracle, DuckDB, ClickHouse, MongoDB and Redis in one container. Schema
  explorer, SQL editor with completion and history, a visual query builder, result charts, ER
  diagrams, schema editing and comparison between connections, saved and scheduled queries, an
  administration surface and an MCP endpoint for AI agents. Connections are added in the
  studio or passed in as WDS_CONN_<NAME> variables. Set the admin account below — with no user
  and password there is no login screen at all, so never publish it without one. Building a
  stack instead? Add WebDataStudio to a database resource in the builder and the connection is
  wired for you. Starts the official image (ghcr.io/fgilde/webdatastudio:latest); nothing is
  stored, so stopping the run leaves nothing behind.
docs: 'https://fgilde.github.io/WebDataStudio/'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-webdatastudio-net
    continueOnError: true

tasks:
  - name: webdatastudio
    run: docker run --rm --name quickrun-webdatastudio --network quickrun-webdatastudio-net -p 8080:8080 ghcr.io/fgilde/webdatastudio:latest
    readyWhen: {http: 'http://localhost:8080'}
    open: true

stop:
  - run: docker rm -f quickrun-webdatastudio
    continueOnError: true
  - run: docker network rm quickrun-webdatastudio-net
    continueOnError: true
