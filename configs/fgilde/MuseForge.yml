# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: MuseForge
repository: fgilde/MuseForge
description: >-
  Self-hosted AI media studio: video, image, audio, long-form text and audiobooks, with an
  LLM-planned Director mode. Drivable from the browser, a script or an AI agent over MCP. GPU
  strongly recommended. Starts the official image (ghcr.io/fgilde/museforge:latest); nothing
  is stored, so stopping the run leaves nothing behind.
docs: 'https://github.com/fgilde/MuseForge'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-museforge-net
    continueOnError: true

tasks:
  - name: museforge
    run: docker run --rm --name quickrun-museforge --network quickrun-museforge-net -p 7860:7860 -e HF_HOME="/data/huggingface" ghcr.io/fgilde/museforge:latest
    readyWhen: {http: 'http://localhost:7860'}
    open: true

stop:
  - run: docker rm -f quickrun-museforge
    continueOnError: true
  - run: docker network rm quickrun-museforge-net
    continueOnError: true
