version: 1
name: Tautulli
repository: Tautulli/Tautulli
description: >-
  Tautulli is the best web application to monitor, view analytics, and receive notifications
  about your Plex Media Server. ... Tautulli is a 3rd party application that you can run
  alongside your Plex Media Server to monitor activity and track various statistics. Most
  importantly, these statistics include what has been watched, who watched it, when and where
  they watched it, and how it was watched. The only thing… Starts the official image
  (ghcr.io/tautulli/tautulli:latest); nothing is stored, so stopping the run leaves nothing
  behind.
docs: 'https://tautulli.com'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-tautulli-net
    continueOnError: true

tasks:
  - name: tautulli
    run: docker run --rm --name quickrun-tautulli --network quickrun-tautulli-net -p 8181:8181 ghcr.io/tautulli/tautulli:latest
    readyWhen: {http: 'http://localhost:8181'}
    open: true

stop:
  - run: docker rm -f quickrun-tautulli
    continueOnError: true
  - run: docker network rm quickrun-tautulli-net
    continueOnError: true
