# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Actual Budget
repository: actualbudget/actual
description: >-
  A local-first personal finance app Starts the official image
  (actualbudget/actual-server:latest); nothing is stored, so stopping the run leaves nothing
  behind.
docs: 'https://actualbudget.org'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-actualbudget-net
    continueOnError: true

tasks:
  - name: actualbudget
    run: docker run --rm --name quickrun-actualbudget --network quickrun-actualbudget-net -p 5006:5006 actualbudget/actual-server:latest
    readyWhen: {http: 'http://localhost:5006'}
    open: true

stop:
  - run: docker rm -f quickrun-actualbudget
    continueOnError: true
  - run: docker network rm quickrun-actualbudget-net
    continueOnError: true
