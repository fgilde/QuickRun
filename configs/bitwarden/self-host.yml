# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Bitwarden
repository: bitwarden/self-host
description: >-
  Bitwarden — the official self-hosted server (Bitwarden Lite, formerly "unified"), the real
  thing rather than a reimplementation: vaults, organisations, collections, sends,
  attachments, the admin portal and the official web vault, with a MariaDB companion. Two
  things it needs from you: an installation id and key from https://bitwarden.com/host (free,
  one form), and HTTPS on the domain you set below — the browser extensions and mobile apps
  refuse a plain-http server. Put a proxy with a certificate in front of it (the domain dialog
  does that for you) and set BW_DOMAIN to that URL. Wants about 1–2 GB of RAM; for a smaller
  box, Vaultwarden in this store speaks the same client protocol at a fraction of the size.
  Starts the official image (ghcr.io/bitwarden/lite:latest); nothing is stored, so stopping
  the run leaves nothing behind.
docs: 'https://bitwarden.com'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-bitwarden-net
    continueOnError: true

tasks:
  - name: db
    run: docker run --rm --name quickrun-bitwarden-db --network quickrun-bitwarden-net -e MARIADB_USER="bitwarden" -e MARIADB_PASSWORD="bitwarden" -e MARIADB_DATABASE="bitwarden_vault" -e MARIADB_RANDOM_ROOT_PASSWORD="true" mariadb:11
    readyWhen: {log: ready for connections}
  - name: bitwarden
    run: docker run --rm --name quickrun-bitwarden --network quickrun-bitwarden-net -p 8080:8080 -e BW_DB_PROVIDER="mysql" -e BW_DB_SERVER="quickrun-bitwarden-db" -e BW_DB_DATABASE="bitwarden_vault" -e BW_DB_USERNAME="bitwarden" -e BW_DB_PASSWORD="bitwarden" -e BW_ENABLE_ADMIN="true" ghcr.io/bitwarden/lite:latest
    dependsOn: [db]
    readyWhen: {http: 'http://localhost:8080'}
    open: true

stop:
  - run: docker rm -f quickrun-bitwarden-db
    continueOnError: true
  - run: docker rm -f quickrun-bitwarden
    continueOnError: true
  - run: docker network rm quickrun-bitwarden-net
    continueOnError: true
