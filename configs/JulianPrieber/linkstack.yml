# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: LinkStack
repository: JulianPrieber/linkstack
description: >-
  LinkStack — self-hosted 'link in bio' page. Complete admin + setup via the web wizard on
  first run. Starts the official image (linkstackorg/linkstack:latest); nothing is stored, so
  stopping the run leaves nothing behind.
docs: 'https://linkstack.org'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-linkstack-net
    continueOnError: true

tasks:
  - name: linkstack
    run: docker run --rm --name quickrun-linkstack --network quickrun-linkstack-net -p 80:80 linkstackorg/linkstack:latest
    readyWhen: {http: 'http://localhost:80'}
    open: true

stop:
  - run: docker rm -f quickrun-linkstack
    continueOnError: true
  - run: docker network rm quickrun-linkstack-net
    continueOnError: true
