# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Kanboard
repository: kanboard/kanboard
description: >-
  Kanboard — lean kanban project management. Single container, SQLite on a volume, no database
  needed. First login: admin / admin — change it. Starts the official image
  (kanboard/kanboard:latest); nothing is stored, so stopping the run leaves nothing behind.
docs: 'https://kanboard.org'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-kanboard-net
    continueOnError: true

tasks:
  - name: kanboard
    run: docker run --rm --name quickrun-kanboard --network quickrun-kanboard-net -p 80:80 kanboard/kanboard:latest
    readyWhen: {http: 'http://localhost:80'}
    open: true

stop:
  - run: docker rm -f quickrun-kanboard
    continueOnError: true
  - run: docker network rm quickrun-kanboard-net
    continueOnError: true
