# Generated by scripts/build-collection.mjs from AspireUI's container catalogue.
# Edit by hand only if you also remove this file from configs/GENERATED.
#
# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: JupyterLab
repository: jupyterlab/jupyterlab
description: >-
  JupyterLab — notebooks for data science / Python. Access needs the token (?token=...),
  seeded as a parameter. Use scipy/datascience image variants for more libs. Starts the
  official image (quay.io/jupyter/base-notebook:latest); nothing is stored, so stopping the
  run leaves nothing behind.
docs: 'https://jupyter.org'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-jupyterlab-net
    continueOnError: true

tasks:
  - name: jupyterlab
    run: docker run --rm --name quickrun-jupyterlab --network quickrun-jupyterlab-net -p 8888:8888 quay.io/jupyter/base-notebook:latest
    readyWhen: {http: 'http://localhost:8888'}
    open: true

stop:
  - run: docker rm -f quickrun-jupyterlab
    continueOnError: true
  - run: docker network rm quickrun-jupyterlab-net
    continueOnError: true
