# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: linkding
repository: sissbruecker/linkding
description: >-
  A self-hosted bookmark manager designed to be minimal, fast, and easy to set up. ...
  Automatically fetches titles, descriptions, icons and preview images of bookmarked websites.
  Seeds an admin user (change the password). Starts the official image
  (sissbruecker/linkding:latest); nothing is stored, so stopping the run leaves nothing
  behind.
docs: 'https://linkding.link'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-linkding-net
    continueOnError: true

tasks:
  - name: linkding
    run: docker run --rm --name quickrun-linkding --network quickrun-linkding-net -p 9090:9090 sissbruecker/linkding:latest
    readyWhen: {http: 'http://localhost:9090'}
    open: true

stop:
  - run: docker rm -f quickrun-linkding
    continueOnError: true
  - run: docker network rm quickrun-linkding-net
    continueOnError: true
