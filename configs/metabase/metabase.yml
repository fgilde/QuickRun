version: 1
name: Metabase
repository: metabase/metabase
description: >-
  Metabase — BI dashboards & ad-hoc analytics over your databases. Starts the official image
  (metabase/metabase:latest); nothing is stored, so stopping the run leaves nothing behind.
docs: 'https://www.metabase.com'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-metabase-net
    continueOnError: true

tasks:
  - name: metabase
    run: docker run --rm --name quickrun-metabase --network quickrun-metabase-net -p 3000:3000 metabase/metabase:latest
    readyWhen: {http: 'http://localhost:3000'}
    open: true

stop:
  - run: docker rm -f quickrun-metabase
    continueOnError: true
  - run: docker network rm quickrun-metabase-net
    continueOnError: true
