# Generated by scripts/build-collection.mjs from AspireUI's container catalogue.
# Edit by hand only if you also remove this file from configs/GENERATED.
#
# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: wallabag
repository: wallabag/wallabag
description: >-
  wallabag — save and read articles later, ad-free (the self-hosted Pocket). Runs on SQLite in
  a single container. First login: wallabag / wallabag — change it right away. Starts the
  official image (wallabag/wallabag:latest); nothing is stored, so stopping the run leaves
  nothing behind.
docs: 'https://wallabag.org'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-wallabag-net
    continueOnError: true

tasks:
  - name: wallabag
    run: docker run --rm --name quickrun-wallabag --network quickrun-wallabag-net -p 80:80 -e SYMFONY__ENV__DATABASE_DRIVER="pdo_sqlite" -e SYMFONY__ENV__DATABASE_PATH="/var/www/wallabag/data/db/wallabag.sqlite" -e SYMFONY__ENV__MAILER_DSN="smtp://127.0.0.1" -e SYMFONY__ENV__FROM_EMAIL="wallabag@example.com" -e POPULATE_DATABASE="true" wallabag/wallabag:latest
    readyWhen: {http: 'http://localhost:80'}
    open: true

stop:
  - run: docker rm -f quickrun-wallabag
    continueOnError: true
  - run: docker network rm quickrun-wallabag-net
    continueOnError: true
