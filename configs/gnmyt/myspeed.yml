# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: MySpeed
repository: gnmyt/myspeed
description: >-
  MySpeed — scheduled internet speed-test monitoring with history/graphs. Set an access
  password in the UI after first launch. Starts the official image
  (germannewsmaker/myspeed:latest); nothing is stored, so stopping the run leaves nothing
  behind.
docs: 'https://myspeed.dev'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-myspeed-net
    continueOnError: true

tasks:
  - name: myspeed
    run: docker run --rm --name quickrun-myspeed --network quickrun-myspeed-net -p 5216:5216 germannewsmaker/myspeed:latest
    readyWhen: {http: 'http://localhost:5216'}
    open: true

stop:
  - run: docker rm -f quickrun-myspeed
    continueOnError: true
  - run: docker network rm quickrun-myspeed-net
    continueOnError: true
