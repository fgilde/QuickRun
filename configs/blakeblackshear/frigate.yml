# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Frigate NVR
repository: blakeblackshear/frigate
description: >-
  NVR with realtime local object detection for IP cameras Ships a minimal config.yml (no
  cameras, auth/tls off) so it starts; add cameras + a detector (Coral/GPU). Starts the
  official image (ghcr.io/blakeblackshear/frigate:stable); nothing is stored, so stopping the
  run leaves nothing behind.
docs: 'https://frigate.video'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-frigate-net
    continueOnError: true

tasks:
  - name: frigate
    run: docker run --rm --name quickrun-frigate --network quickrun-frigate-net -p 8971:8971 ghcr.io/blakeblackshear/frigate:stable
    readyWhen: {http: 'http://localhost:8971'}
    open: true

stop:
  - run: docker rm -f quickrun-frigate
    continueOnError: true
  - run: docker network rm quickrun-frigate-net
    continueOnError: true
