# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
# What this shows: a generated form - required secret, validated pattern, number range, dropdown.
version: 1
name: AI chat demo
inputs:
  - id: apiKey
    label: OpenAI API key
    type: password
    description: Created at platform.openai.com
    required: true
    pattern: "^sk-"
    env: OPENAI_API_KEY
  - id: port
    label: Port
    type: number
    default: "3000"
    min: 1024
    max: 65535
    env: PORT
  - id: model
    label: Model
    type: select
    options: [gpt-4o-mini, gpt-4o]
    default: gpt-4o-mini
    env: MODEL
  - id: verbose
    label: Verbose logging
    type: bool
    default: "false"
    env: VERBOSE
setup:
  - npm ci
tasks:
  - name: app
    run: npm start
    readyWhen: {port: 3000}
    open: "http://localhost:${inputs.port}"
