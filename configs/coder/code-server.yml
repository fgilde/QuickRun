# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: code-server
repository: coder/code-server
description: >-
  code-server — VS Code in the browser. Login password seeded as a parameter (change it);
  without it code-server generates a random one each start. Starts the official image
  (codercom/code-server:latest); nothing is stored, so stopping the run leaves nothing behind.
docs: 'https://github.com/coder/code-server'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-code-server-net
    continueOnError: true

tasks:
  - name: code-server
    run: docker run --rm --name quickrun-code-server --network quickrun-code-server-net -p 8080:8080 codercom/code-server:latest
    readyWhen: {http: 'http://localhost:8080'}
    open: true

stop:
  - run: docker rm -f quickrun-code-server
    continueOnError: true
  - run: docker network rm quickrun-code-server-net
    continueOnError: true
