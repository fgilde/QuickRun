version: 1
name: Syncthing
repository: syncthing/syncthing
description: >-
  Syncthing — continuous, peer-to-peer file synchronization (web UI on 8384). Starts the
  official image (lscr.io/linuxserver/syncthing:latest); nothing is stored, so stopping the
  run leaves nothing behind.
docs: 'https://syncthing.net'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-syncthing-net
    continueOnError: true

tasks:
  - name: syncthing
    run: docker run --rm --name quickrun-syncthing --network quickrun-syncthing-net -p 8384:8384 lscr.io/linuxserver/syncthing:latest
    readyWhen: {http: 'http://localhost:8384'}
    open: true

stop:
  - run: docker rm -f quickrun-syncthing
    continueOnError: true
  - run: docker network rm quickrun-syncthing-net
    continueOnError: true
