version: 1
name: Node-RED
repository: node-red/node-red
description: >-
  Node-RED is a flow-based programming tool, originally developed by IBM Emerging Technology
  Services team and now a part of the OpenJS Foundation. ... Node-RED provides a browser-based
  flow editor that makes it easy to wire together flows using the wide range of nodes in the
  palette. Flows can be then deployed to the runtime in a single-click. ... The light-weight
  runtime is built on Node.js, taking full advantage… Starts the official image
  (nodered/node-red:latest); nothing is stored, so stopping the run leaves nothing behind.
docs: 'https://nodered.org'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-nodered-net
    continueOnError: true

tasks:
  - name: nodered
    run: docker run --rm --name quickrun-nodered --network quickrun-nodered-net -p 1880:1880 nodered/node-red:latest
    readyWhen: {http: 'http://localhost:1880'}
    open: true

stop:
  - run: docker rm -f quickrun-nodered
    continueOnError: true
  - run: docker network rm quickrun-nodered-net
    continueOnError: true
