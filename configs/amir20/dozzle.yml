# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Dozzle
repository: amir20/dozzle
description: >-
  Realtime log viewer for containers. Supports Docker, Swarm and K8s. Starts the official
  image (amir20/dozzle:latest); nothing is stored, so stopping the run leaves nothing behind.
docs: 'https://dozzle.dev'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-dozzle-net
    continueOnError: true

tasks:
  - name: dozzle
    run: docker run --rm --name quickrun-dozzle --network quickrun-dozzle-net -p 8080:8080 amir20/dozzle:latest
    readyWhen: {http: 'http://localhost:8080'}
    open: true

stop:
  - run: docker rm -f quickrun-dozzle
    continueOnError: true
  - run: docker network rm quickrun-dozzle-net
    continueOnError: true
