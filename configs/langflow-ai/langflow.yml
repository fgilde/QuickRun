version: 1
name: Langflow
repository: langflow-ai/langflow
description: >-
  This section includes the ... the world. ... To self-host your local server through an ngrok
  gateway, see Deploy a public Langflow server. This approach uses ngrok to forward traffic
  and share your local Langflow server over the internet, without deploying to a cloud
  provider or exposing your network directly. Superuser seeded (admin/admin — change it).
  Starts the official image (langflowai/langflow:latest); nothing is stored, so stopping the
  run leaves nothing behind.
docs: 'https://www.langflow.org'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-langflow-net
    continueOnError: true

tasks:
  - name: langflow
    run: docker run --rm --name quickrun-langflow --network quickrun-langflow-net -p 7860:7860 -e LANGFLOW_AUTO_LOGIN="false" langflowai/langflow:latest
    readyWhen: {http: 'http://localhost:7860'}
    open: true

stop:
  - run: docker rm -f quickrun-langflow
    continueOnError: true
  - run: docker network rm quickrun-langflow-net
    continueOnError: true
