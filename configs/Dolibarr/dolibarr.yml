# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Dolibarr
repository: Dolibarr/dolibarr
description: >-
  Dolibarr — open-source ERP and CRM (invoices, orders, stock, projects). MariaDB companion
  included; the admin account below is created on first start. Starts the official image
  (dolibarr/dolibarr:latest); nothing is stored, so stopping the run leaves nothing behind.
docs: 'https://www.dolibarr.org'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-dolibarr-net
    continueOnError: true

tasks:
  - name: db
    run: docker run --rm --name quickrun-dolibarr-db --network quickrun-dolibarr-net -e MYSQL_ROOT_PASSWORD=dolibarr -e MYSQL_DATABASE=dolibarr -e MYSQL_USER=dolibarr -e MYSQL_PASSWORD=dolibarr lscr.io/linuxserver/mariadb:latest
    readyWhen: {log: ready for connections}
  - name: dolibarr
    run: docker run --rm --name quickrun-dolibarr --network quickrun-dolibarr-net -p 80:80 -e DOLI_DB_HOST=quickrun-dolibarr-db -e DOLI_DB_NAME=dolibarr -e DOLI_DB_USER=dolibarr -e DOLI_DB_PASSWORD=dolibarr -e DOLI_ADMIN_LOGIN=admin -e DOLI_INSTALL_AUTO=1 dolibarr/dolibarr:latest
    dependsOn: [db]
    readyWhen: {http: 'http://localhost:80'}
    open: true

stop:
  - run: docker rm -f quickrun-dolibarr-db
    continueOnError: true
  - run: docker rm -f quickrun-dolibarr
    continueOnError: true
  - run: docker network rm quickrun-dolibarr-net
    continueOnError: true
