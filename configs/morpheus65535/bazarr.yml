version: 1
name: Bazarr
repository: morpheus65535/bazarr
description: >-
  Bazarr is a companion application to Sonarr and Radarr. It manages and downloads subtitles
  based on your requirements. You define your preferences by TV show or movie and Bazarr takes
  care of everything for you. Bazarr — companion to Sonarr/Radarr that manages & downloads
  subtitles. Starts the official image (lscr.io/linuxserver/bazarr:latest); nothing is stored,
  so stopping the run leaves nothing behind.
docs: 'https://www.bazarr.media'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-bazarr-net
    continueOnError: true

tasks:
  - name: bazarr
    run: docker run --rm --name quickrun-bazarr --network quickrun-bazarr-net -p 6767:6767 lscr.io/linuxserver/bazarr:latest
    readyWhen: {http: 'http://localhost:6767'}
    open: true

stop:
  - run: docker rm -f quickrun-bazarr
    continueOnError: true
  - run: docker network rm quickrun-bazarr-net
    continueOnError: true
