# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: electrs
repository: romanz/electrs
description: >-
  Rust Electrum server (romanz/electrs). Needs a local Bitcoin Core node with txindex — reads
  the blocks dir + points at its RPC. Starts the official image (getumbrel/electrs:v0.11.0);
  nothing is stored, so stopping the run leaves nothing behind.
docs: 'https://github.com/romanz/electrs'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-electrs-net
    continueOnError: true

tasks:
  - name: electrs
    run: docker run --rm --name quickrun-electrs --network quickrun-electrs-net -p 50001:50001 -e ELECTRS_ELECTRUM_RPC_ADDR=0.0.0.0:50001 getumbrel/electrs:v0.11.0
    readyWhen: {http: 'http://localhost:50001'}
    open: true

stop:
  - run: docker rm -f quickrun-electrs
    continueOnError: true
  - run: docker network rm quickrun-electrs-net
    continueOnError: true
