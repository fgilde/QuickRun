# Generated by scripts/build-collection.mjs from AspireUI's container catalogue.
# Edit by hand only if you also remove this file from configs/GENERATED.
#
# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Flowise
repository: FlowiseAI/Flowise
description: >-
  Build AI Agents, Visually Starts the official image (flowiseai/flowise:latest); nothing is
  stored, so stopping the run leaves nothing behind.
docs: 'https://flowiseai.com'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-flowise-net
    continueOnError: true

tasks:
  - name: flowise
    run: docker run --rm --name quickrun-flowise --network quickrun-flowise-net -p 3000:3000 flowiseai/flowise:latest
    readyWhen: {http: 'http://localhost:3000'}
    open: true

stop:
  - run: docker rm -f quickrun-flowise
    continueOnError: true
  - run: docker network rm quickrun-flowise-net
    continueOnError: true
