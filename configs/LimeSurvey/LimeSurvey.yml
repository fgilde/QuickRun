# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: LimeSurvey
repository: LimeSurvey/LimeSurvey
description: >-
  LimeSurvey — full-featured survey and questionnaire tool. MariaDB companion included; the
  admin account below is created on first start. Starts the official image
  (martialblog/limesurvey:6-apache); nothing is stored, so stopping the run leaves nothing
  behind.
docs: 'https://www.limesurvey.org'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-limesurvey-net
    continueOnError: true

tasks:
  - name: db
    run: docker run --rm --name quickrun-limesurvey-db --network quickrun-limesurvey-net -e MYSQL_ROOT_PASSWORD=limesurvey -e MYSQL_DATABASE=limesurvey -e MYSQL_USER=limesurvey -e MYSQL_PASSWORD=limesurvey lscr.io/linuxserver/mariadb:latest
    readyWhen: {log: ready for connections}
  - name: limesurvey
    run: docker run --rm --name quickrun-limesurvey --network quickrun-limesurvey-net -p 8080:8080 -e DB_TYPE=mysql -e DB_HOST=quickrun-limesurvey-db -e DB_PORT=3306 -e DB_NAME=limesurvey -e DB_USERNAME=limesurvey -e DB_PASSWORD=limesurvey -e ADMIN_USER=admin -e ADMIN_NAME=Administrator -e ADMIN_EMAIL=admin@example.com martialblog/limesurvey:6-apache
    dependsOn: [db]
    readyWhen: {http: 'http://localhost:8080'}
    open: true

stop:
  - run: docker rm -f quickrun-limesurvey-db
    continueOnError: true
  - run: docker rm -f quickrun-limesurvey
    continueOnError: true
  - run: docker network rm quickrun-limesurvey-net
    continueOnError: true
