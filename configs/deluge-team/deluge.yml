version: 1
name: Deluge
repository: deluge-team/deluge
description: >-
  ## A Lightweight Torrent Client with a Plugin Ecosystem ... Deluge is a free, cross-platform
  BitTorrent client with full encryption, a web UI, and an extensible plugin system. Unlike
  qBittorrent, which bundles everything into one package, Deluge separates the daemon
  (libtorrent engine) from its interfaces — you can control one daemon from the web UI, a
  desktop GTK client, or the command line simultaneously. This… Starts the official image
  (lscr.io/linuxserver/deluge:latest); nothing is stored, so stopping the run leaves nothing
  behind.
docs: 'https://deluge-torrent.org'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-deluge-net
    continueOnError: true

tasks:
  - name: deluge
    run: docker run --rm --name quickrun-deluge --network quickrun-deluge-net -p 8112:8112 lscr.io/linuxserver/deluge:latest
    readyWhen: {http: 'http://localhost:8112'}
    open: true

stop:
  - run: docker rm -f quickrun-deluge
    continueOnError: true
  - run: docker network rm quickrun-deluge-net
    continueOnError: true
