version: 1
name: Jaeger
repository: jaegertracing/jaeger
description: >-
  Jaeger backend is released as a single binary or container image (see Downloads). Despite
  that, it can be configured to operate in different roles, such as all-in-one, collector,
  query, and ingester (see Architecture). ... An explicit YAML configuration file must be
  provided via the`--config` command line argument (see Configuration). When running in a
  container, the path to the config file must be mapped into the… Starts the official image
  (jaegertracing/all-in-one:latest); nothing is stored, so stopping the run leaves nothing
  behind.
docs: 'https://www.jaegertracing.io'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-jaeger-net
    continueOnError: true

tasks:
  - name: jaeger
    run: docker run --rm --name quickrun-jaeger --network quickrun-jaeger-net -p 16686:16686 jaegertracing/all-in-one:latest
    readyWhen: {http: 'http://localhost:16686'}
    open: true

stop:
  - run: docker rm -f quickrun-jaeger
    continueOnError: true
  - run: docker network rm quickrun-jaeger-net
    continueOnError: true
