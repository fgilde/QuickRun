# Generated by scripts/build-collection.mjs from AspireUI's container catalogue.
# Edit by hand only if you also remove this file from configs/GENERATED.
#
# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Ghostfolio
repository: ghostfolio/ghostfolio
description: >-
  Open Source Wealth Management Software. Angular + NestJS + Prisma + Nx + TypeScript 🤍
  Postgres + Redis companions. ACCESS_TOKEN_SALT & JWT_SECRET_KEY seeded as params (change
  them). Starts the official image (ghostfolio/ghostfolio:latest); nothing is stored, so
  stopping the run leaves nothing behind.
docs: 'https://ghostfol.io'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-ghostfolio-net
    continueOnError: true

tasks:
  - name: db
    run: docker run --rm --name quickrun-ghostfolio-db --network quickrun-ghostfolio-net -e POSTGRES_DB=ghostfolio -e POSTGRES_USER=ghostfolio -e POSTGRES_PASSWORD=ghostfolio postgres:16
    readyWhen: {log: database system is ready to accept connections}
  - name: redis
    run: docker run --rm --name quickrun-ghostfolio-redis --network quickrun-ghostfolio-net -p 6379:6379 redis:7
    readyWhen: {log: Ready to accept connections}
  - name: ghostfolio
    run: docker run --rm --name quickrun-ghostfolio --network quickrun-ghostfolio-net -p 3333:3333 -e DATABASE_URL="postgresql://ghostfolio:ghostfolio@quickrun-ghostfolio-db:5432/ghostfolio?sslmode=disable" -e REDIS_HOST=quickrun-ghostfolio-redis -e REDIS_PORT=6379 -e NODE_ENV=production ghostfolio/ghostfolio:latest
    dependsOn: [db, redis]
    readyWhen: {http: 'http://localhost:3333'}
    open: true

stop:
  - run: docker rm -f quickrun-ghostfolio-db
    continueOnError: true
  - run: docker rm -f quickrun-ghostfolio-redis
    continueOnError: true
  - run: docker rm -f quickrun-ghostfolio
    continueOnError: true
  - run: docker network rm quickrun-ghostfolio-net
    continueOnError: true
