# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Navidrome
repository: navidrome/navidrome
description: >-
  Navidrome — self-hosted music streaming (Subsonic-compatible). Starts the official image
  (deluan/navidrome:latest); nothing is stored, so stopping the run leaves nothing behind.
docs: 'https://www.navidrome.org'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-navidrome-net
    continueOnError: true

tasks:
  - name: navidrome
    run: docker run --rm --name quickrun-navidrome --network quickrun-navidrome-net -p 4533:4533 deluan/navidrome:latest
    readyWhen: {http: 'http://localhost:4533'}
    open: true

stop:
  - run: docker rm -f quickrun-navidrome
    continueOnError: true
  - run: docker network rm quickrun-navidrome-net
    continueOnError: true
