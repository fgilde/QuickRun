version: 1
name: LeafWiki
repository: leaf-wiki/leaf-wiki
description: >-
  LeafWiki — lightweight self-hosted wiki (single Go binary + SQLite, Markdown on disk). Set
  ALLOW_INSECURE=true for plain HTTP. Starts the official image
  (ghcr.io/perber/leafwiki:latest); nothing is stored, so stopping the run leaves nothing
  behind.
docs: 'https://leafwiki.com'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-leafwiki-net
    continueOnError: true

tasks:
  - name: leafwiki
    run: docker run --rm --name quickrun-leafwiki --network quickrun-leafwiki-net -p 8080:8080 -e LEAFWIKI_ALLOW_INSECURE="true" ghcr.io/perber/leafwiki:latest
    readyWhen: {http: 'http://localhost:8080'}
    open: true

stop:
  - run: docker rm -f quickrun-leafwiki
    continueOnError: true
  - run: docker network rm quickrun-leafwiki-net
    continueOnError: true
