# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Maestro
repository: fgilde/Maestro
description: >-
  All-in-one, 100% local AI video, image and music studio with a Director mode that plans
  music videos and short films from a prompt. GPU strongly recommended. Starts the official
  image (ghcr.io/fgilde/maestro:latest); nothing is stored, so stopping the run leaves nothing
  behind.
docs: 'https://github.com/fgilde/Maestro'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-maestro-net
    continueOnError: true

tasks:
  - name: maestro
    run: docker run --rm --name quickrun-maestro --network quickrun-maestro-net -p 7860:7860 -e HF_HOME=/data/huggingface ghcr.io/fgilde/maestro:latest
    readyWhen: {http: 'http://localhost:7860'}
    open: true

stop:
  - run: docker rm -f quickrun-maestro
    continueOnError: true
  - run: docker network rm quickrun-maestro-net
    continueOnError: true
