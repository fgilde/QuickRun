# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Cosmos Server
repository: azukaar/Cosmos-Server
description: >-
  ☁️ The Most Secure and Easy Selfhosted Home Server. Take control of your data and privacy
  without sacrificing security and stability (Authentication, anti-DDOS, anti-bot) Starts the
  official image (azukaar/cosmos-server:latest); nothing is stored, so stopping the run leaves
  nothing behind.
docs: 'https://cosmos-cloud.io'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-cosmos-server-net
    continueOnError: true

tasks:
  - name: cosmos-server
    run: docker run --rm --name quickrun-cosmos-server --network quickrun-cosmos-server-net -p 80:80 azukaar/cosmos-server:latest
    readyWhen: {http: 'http://localhost:80'}
    open: true

stop:
  - run: docker rm -f quickrun-cosmos-server
    continueOnError: true
  - run: docker network rm quickrun-cosmos-server-net
    continueOnError: true
