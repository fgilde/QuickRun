version: 1
name: Mealie
repository: mealie-recipes/mealie
description: >-
  Mealie is a self hosted recipe manager and meal planner with a RestAPI backend and a
  reactive frontend application built in Vue for a pleasant user experience for the whole
  family. Easily add recipes into your database by providing the url and Mealie will
  automatically import the relevant data or add a family recipe with the UI editor. Mealie
  also provides an API for interactions from 3rd party applications. Starts the official image
  (ghcr.io/mealie-recipes/mealie:latest); nothing is stored, so stopping the run leaves
  nothing behind.
docs: 'https://mealie.io'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-mealie-net
    continueOnError: true

tasks:
  - name: mealie
    run: docker run --rm --name quickrun-mealie --network quickrun-mealie-net -p 9000:9000 ghcr.io/mealie-recipes/mealie:latest
    readyWhen: {http: 'http://localhost:9000'}
    open: true

stop:
  - run: docker rm -f quickrun-mealie
    continueOnError: true
  - run: docker network rm quickrun-mealie-net
    continueOnError: true
