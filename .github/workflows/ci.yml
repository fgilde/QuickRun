name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore
      - run: dotnet test --no-build --verbosity normal

      - name: Site builds and carries no page-wide styles
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cd site
          npm ci || npm install
          npx vitepress build
          node check-build.mjs

      # A syntax error in a shipped page is invisible until somebody opens it, and then the window
      # draws and does nothing. Seconds, no browser.
      - name: Pages parse
        shell: bash
        run: node scripts/check-pages.mjs

      - name: Extension builds for both targets
        shell: bash
        run: |
          cd extension
          sh build.sh 0.0.0-ci
          test -f dist/quickrun-chromium-0.0.0-ci.zip
          test -f dist/quickrun-firefox-0.0.0-ci.zip

      - name: Extension tests
        shell: bash
        run: node --test extension/test/*.test.js

      # The confirmation window, actually loaded in a browser with a real plan. A page that throws
      # while drawing fails silently - the exception goes to a console nobody has open, the window
      # looks merely empty, and the buttons do nothing because the module never bound them. That
      # shipped once; nothing but running the page catches it.
      - name: Confirmation window renders and its buttons work
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: node scripts/drive-confirm.mjs extension/test/fixtures/plan.json

      # And QuickRun's own window: every tab has to open, and it has to say where it is listening.
      - name: The window works
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          dotnet build src/QuickRun.App -c Debug
          node scripts/drive-dashboard.mjs --exe src/QuickRun.App/bin/Debug/net10.0/quickrun
