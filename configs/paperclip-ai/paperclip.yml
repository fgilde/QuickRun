# Generated by scripts/build-collection.mjs from AspireUI's container catalogue.
# Edit by hand only if you also remove this file from configs/GENERATED.
#
# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Paperclip AI
repository: paperclip-ai/paperclip
description: >-
  Paperclip (paperclipai) — open platform for orchestrating AI agents. API on 3100; embedded
  Postgres, no DB setup needed. BETTER_AUTH_SECRET seeded as a parameter (change it). Starts
  the official image (ghcr.io/paperclipai/paperclip:latest); nothing is stored, so stopping
  the run leaves nothing behind.
docs: 'https://github.com/paperclipai/paperclip'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-paperclip-net
    continueOnError: true

tasks:
  - name: paperclip
    run: docker run --rm --name quickrun-paperclip --network quickrun-paperclip-net -p 3100:3100 ghcr.io/paperclipai/paperclip:latest
    readyWhen: {http: 'http://localhost:3100'}
    open: true

stop:
  - run: docker rm -f quickrun-paperclip
    continueOnError: true
  - run: docker network rm quickrun-paperclip-net
    continueOnError: true
