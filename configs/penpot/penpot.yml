# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Penpot
repository: penpot/penpot
description: >-
  Penpot — open-source design & prototyping (Figma alternative). Frontend + backend + exporter
  + Postgres + Redis. Register the first account in-app. Set PENPOT_PUBLIC_URI to how you
  reach it. Starts the official image (penpotapp/frontend:latest); nothing is stored, so
  stopping the run leaves nothing behind.
docs: 'https://penpot.app'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-penpot-net
    continueOnError: true

tasks:
  - name: backend
    run: docker run --rm --name quickrun-penpot-backend --network quickrun-penpot-net -p 6060:6060 penpotapp/backend:latest
    readyWhen: {port: 6060}
  - name: exporter
    run: docker run --rm --name quickrun-penpot-exporter --network quickrun-penpot-net -p 6061:6061 penpotapp/exporter:latest
    readyWhen: {port: 6061}
  - name: db
    run: docker run --rm --name quickrun-penpot-db --network quickrun-penpot-net postgres:16
  - name: redis
    run: docker run --rm --name quickrun-penpot-redis --network quickrun-penpot-net -p 6379:6379 redis:7
    readyWhen: {port: 6379}
  - name: penpot
    run: docker run --rm --name quickrun-penpot --network quickrun-penpot-net -p 8080:8080 -e PENPOT_FLAGS="enable-registration enable-login-with-password disable-email-verification disable-secure-session-cookies" -e PENPOT_BACKEND_URI="http://quickrun-penpot-backend:6060" -e PENPOT_EXPORTER_URI="http://quickrun-penpot-exporter:6061" penpotapp/frontend:latest
    dependsOn: [backend, exporter, db, redis]
    readyWhen: {http: 'http://localhost:8080'}
    open: true

stop:
  - run: docker rm -f quickrun-penpot-backend
    continueOnError: true
  - run: docker rm -f quickrun-penpot-exporter
    continueOnError: true
  - run: docker rm -f quickrun-penpot-db
    continueOnError: true
  - run: docker rm -f quickrun-penpot-redis
    continueOnError: true
  - run: docker rm -f quickrun-penpot
    continueOnError: true
  - run: docker network rm quickrun-penpot-net
    continueOnError: true
