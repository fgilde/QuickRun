# Generated by scripts/build-collection.mjs from AspireUI's container catalogue.
# Edit by hand only if you also remove this file from configs/GENERATED.
#
# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Open WebUI
repository: open-webui/open-webui
description: >-
  Open WebUI — chat UI for Ollama / OpenAI-compatible backends. Point OLLAMA_BASE_URL /
  OPENAI_API_BASE_URL at your model resource. Starts the official image
  (ghcr.io/open-webui/open-webui:main); nothing is stored, so stopping the run leaves nothing
  behind.
docs: 'https://openwebui.com'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-openwebui-net
    continueOnError: true

tasks:
  - name: openwebui
    run: docker run --rm --name quickrun-openwebui --network quickrun-openwebui-net -p 8080:8080 ghcr.io/open-webui/open-webui:main
    readyWhen: {http: 'http://localhost:8080'}
    open: true

stop:
  - run: docker rm -f quickrun-openwebui
    continueOnError: true
  - run: docker network rm quickrun-openwebui-net
    continueOnError: true
