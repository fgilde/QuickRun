version: 1
name: LNbits
repository: lnbits/lnbits
description: >-
  LNbits, free and open-source Lightning wallet and accounts system. ... # LNbits — The most
  powerful Bitcoin & Lightning toolkit ... LNbits is a lightweight Python server that sits on
  top of your Lightning funding source. It gives you safe, isolated wallets, a clean API, and
  an extension system for rapidly adding features - without locking you into a single node
  implementation. The Inspiration for LNBits came from… Starts the official image
  (lnbits/lnbits:latest); nothing is stored, so stopping the run leaves nothing behind.
docs: 'https://lnbits.com'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-lnbits-net
    continueOnError: true

tasks:
  - name: lnbits
    run: docker run --rm --name quickrun-lnbits --network quickrun-lnbits-net -p 5000:5000 -e LNBITS_DATA_FOLDER=/app/data -e LNBITS_BACKEND_WALLET_CLASS=VoidWallet -e HOST=0.0.0.0 -e PORT=5000 lnbits/lnbits:latest
    readyWhen: {http: 'http://localhost:5000'}
    open: true

stop:
  - run: docker rm -f quickrun-lnbits
    continueOnError: true
  - run: docker network rm quickrun-lnbits-net
    continueOnError: true
