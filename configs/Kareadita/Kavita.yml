# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Kavita
repository: Kareadita/Kavita
description: >-
  Kavita — fast, cross-platform reading server (comics, manga, books). Starts the official
  image (lscr.io/linuxserver/kavita:latest); nothing is stored, so stopping the run leaves
  nothing behind.
docs: 'https://www.kavitareader.com'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-kavita-net
    continueOnError: true

tasks:
  - name: kavita
    run: docker run --rm --name quickrun-kavita --network quickrun-kavita-net -p 5000:5000 lscr.io/linuxserver/kavita:latest
    readyWhen: {http: 'http://localhost:5000'}
    open: true

stop:
  - run: docker rm -f quickrun-kavita
    continueOnError: true
  - run: docker network rm quickrun-kavita-net
    continueOnError: true
