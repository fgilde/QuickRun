# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Vikunja
repository: go-vikunja/vikunja
description: >-
  Vikunja — self-hosted to-do / task & project management. CORS disabled (single container);
  runs as root so it can create its files dir (image runs as uid 1000 but /app/vikunja is
  root-owned). Starts the official image (vikunja/vikunja:latest); nothing is stored, so
  stopping the run leaves nothing behind.
docs: 'https://vikunja.io'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-vikunja-net
    continueOnError: true

tasks:
  - name: vikunja
    run: docker run --rm --name quickrun-vikunja --network quickrun-vikunja-net -p 3456:3456 -e VIKUNJA_CORS_ENABLE=false vikunja/vikunja:latest
    readyWhen: {http: 'http://localhost:3456'}
    open: true

stop:
  - run: docker rm -f quickrun-vikunja
    continueOnError: true
  - run: docker network rm quickrun-vikunja-net
    continueOnError: true
