version: 1
name: Wallos
repository: ellite/Wallos
description: >-
  Wallos — self-hosted subscription tracker & budget overview (SQLite). Starts the official
  image (bellamy/wallos:latest); nothing is stored, so stopping the run leaves nothing behind.
docs: 'https://github.com/ellite/Wallos'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-wallos-net
    continueOnError: true

tasks:
  - name: wallos
    run: docker run --rm --name quickrun-wallos --network quickrun-wallos-net -p 80:80 bellamy/wallos:latest
    readyWhen: {http: 'http://localhost:80'}
    open: true

stop:
  - run: docker rm -f quickrun-wallos
    continueOnError: true
  - run: docker network rm quickrun-wallos-net
    continueOnError: true
