version: 1
name: Audiobookshelf
repository: advplyr/audiobookshelf
description: >-
  Self-hosted audiobook and podcast server Starts the official image
  (ghcr.io/advplyr/audiobookshelf:latest); nothing is stored, so stopping the run leaves
  nothing behind.
docs: 'https://www.audiobookshelf.org'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-audiobookshelf-net
    continueOnError: true

tasks:
  - name: audiobookshelf
    run: docker run --rm --name quickrun-audiobookshelf --network quickrun-audiobookshelf-net -p 80:80 ghcr.io/advplyr/audiobookshelf:latest
    readyWhen: {http: 'http://localhost:80'}
    open: true

stop:
  - run: docker rm -f quickrun-audiobookshelf
    continueOnError: true
  - run: docker network rm quickrun-audiobookshelf-net
    continueOnError: true
