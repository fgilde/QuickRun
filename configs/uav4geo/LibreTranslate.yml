# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: LibreTranslate
repository: uav4geo/LibreTranslate
description: >-
  LibreTranslate — self-hosted machine translation API/UI (downloads language models on first
  start). Starts the official image (libretranslate/libretranslate:latest); nothing is stored,
  so stopping the run leaves nothing behind.
docs: 'https://libretranslate.com'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-libretranslate-net
    continueOnError: true

tasks:
  - name: libretranslate
    run: docker run --rm --name quickrun-libretranslate --network quickrun-libretranslate-net -p 5000:5000 libretranslate/libretranslate:latest
    readyWhen: {http: 'http://localhost:5000'}
    open: true

stop:
  - run: docker rm -f quickrun-libretranslate
    continueOnError: true
  - run: docker network rm quickrun-libretranslate-net
    continueOnError: true
