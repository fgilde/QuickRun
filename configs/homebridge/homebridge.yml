version: 1
name: Homebridge
repository: homebridge/homebridge
description: >-
  HomeKit support for the impatient. Homebridge — bridge non-HomeKit devices into Apple
  HomeKit; config UI on :8581 (create admin on first visit). Starts the official image
  (homebridge/homebridge:latest); nothing is stored, so stopping the run leaves nothing
  behind.
docs: 'https://homebridge.io'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-homebridge-net
    continueOnError: true

tasks:
  - name: homebridge
    run: docker run --rm --name quickrun-homebridge --network quickrun-homebridge-net -p 8581:8581 homebridge/homebridge:latest
    readyWhen: {http: 'http://localhost:8581'}
    open: true

stop:
  - run: docker rm -f quickrun-homebridge
    continueOnError: true
  - run: docker network rm quickrun-homebridge-net
    continueOnError: true
