# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Stirling-PDF
repository: Stirling-Tools/Stirling-PDF
description: >-
  Stirling PDF is a locally hosted web application that allows you to perform various
  operations on PDF files. With 60+ tools, flexible deployment options, and enterprise
  features, it's the comprehensive PDF solution for individuals and organizations. Starts the
  official image (ghcr.io/stirling-tools/stirling-pdf:latest); nothing is stored, so stopping
  the run leaves nothing behind.
docs: 'https://www.stirlingpdf.com'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-stirling-pdf-net
    continueOnError: true

tasks:
  - name: stirling-pdf
    run: docker run --rm --name quickrun-stirling-pdf --network quickrun-stirling-pdf-net -p 8080:8080 ghcr.io/stirling-tools/stirling-pdf:latest
    readyWhen: {http: 'http://localhost:8080'}
    open: true

stop:
  - run: docker rm -f quickrun-stirling-pdf
    continueOnError: true
  - run: docker network rm quickrun-stirling-pdf-net
    continueOnError: true
