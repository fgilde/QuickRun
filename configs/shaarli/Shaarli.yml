# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Shaarli
repository: shaarli/Shaarli
description: >-
  Shaarli — a minimalist, database-free bookmark manager (personal link log with RSS). Create
  the admin account in the browser on first visit. Starts the official image
  (ghcr.io/shaarli/shaarli:latest); nothing is stored, so stopping the run leaves nothing
  behind.
docs: 'https://shaarli.readthedocs.io'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-shaarli-net
    continueOnError: true

tasks:
  - name: shaarli
    run: docker run --rm --name quickrun-shaarli --network quickrun-shaarli-net -p 80:80 ghcr.io/shaarli/shaarli:latest
    readyWhen: {http: 'http://localhost:80'}
    open: true

stop:
  - run: docker rm -f quickrun-shaarli
    continueOnError: true
  - run: docker network rm quickrun-shaarli-net
    continueOnError: true
