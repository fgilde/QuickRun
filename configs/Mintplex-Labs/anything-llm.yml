# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: AnythingLLM
repository: Mintplex-Labs/anything-llm
description: >-
  Stop renting your intelligence. Own it with AnythingLLM. Everything you need for a powerful
  local-first agent experience Starts the official image (mintplexlabs/anythingllm:latest);
  nothing is stored, so stopping the run leaves nothing behind.
docs: 'https://anythingllm.com'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-anythingllm-net
    continueOnError: true

tasks:
  - name: anythingllm
    run: docker run --rm --name quickrun-anythingllm --network quickrun-anythingllm-net -p 3001:3001 -e STORAGE_DIR="/app/server/storage" mintplexlabs/anythingllm:latest
    readyWhen: {http: 'http://localhost:3001'}
    open: true

stop:
  - run: docker rm -f quickrun-anythingllm
    continueOnError: true
  - run: docker network rm quickrun-anythingllm-net
    continueOnError: true
