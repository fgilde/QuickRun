name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'samples/**'
      - 'schema/**'
      - 'scripts/install.sh'
      - 'quickrun.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        working-directory: site
        run: npm ci || npm install

      # Published so that the schema comment in every sample resolves, and so scoop can install
      # from a URL without a separate bucket repository.
      - name: Stage published files
        run: |
          cp schema/quickrun.schema.json site/public/quickrun.schema.json
          cp scripts/install.sh site/public/install.sh
          cp assets/icon.png site/public/icon.png
          cp assets/logo.png site/public/logo.png

      - name: Build
        working-directory: site
        run: npx vitepress build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
