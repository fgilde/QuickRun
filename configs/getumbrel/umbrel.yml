# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: 'Umbrel (umbrelOS)'
repository: getumbrel/umbrel
description: >-
  Umbrel is a small device that sits in your home and lets you store your files, stream your
  media, run your own AI, and much more. All the convenience of the cloud, but your data stays
  with you. You access it from any device (phone, tablet, or computer) right in your browser.
  ... umbrelOS is the operating system that powers every Umbrel — think macOS or Windows, but
  for your home server. It's designed to be simple… Starts the official image
  (dockurr/umbrel:latest); nothing is stored, so stopping the run leaves nothing behind.
docs: 'https://umbrel.com'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-umbrel-net
    continueOnError: true

tasks:
  - name: umbrel
    run: docker run --rm --name quickrun-umbrel --network quickrun-umbrel-net -p 80:80 dockurr/umbrel:latest
    readyWhen: {http: 'http://localhost:80'}
    open: true

stop:
  - run: docker rm -f quickrun-umbrel
    continueOnError: true
  - run: docker network rm quickrun-umbrel-net
    continueOnError: true
