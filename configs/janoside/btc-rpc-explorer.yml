# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: BTC RPC Explorer
repository: janoside/btc-rpc-explorer
description: >-
  Database-free, self-hosted Bitcoin explorer, via RPC to Bitcoin Core. Starts the official
  image (getumbrel/btc-rpc-explorer:v3.5.1); nothing is stored, so stopping the run leaves
  nothing behind.
docs: 'https://github.com/janoside/btc-rpc-explorer'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-btc-rpc-explorer-net
    continueOnError: true

tasks:
  - name: btc-rpc-explorer
    run: docker run --rm --name quickrun-btc-rpc-explorer --network quickrun-btc-rpc-explorer-net -p 3002:3002 -e BTCEXP_HOST=0.0.0.0 -e BTCEXP_PORT=3002 -e BTCEXP_BITCOIND_PORT=8332 getumbrel/btc-rpc-explorer:v3.5.1
    readyWhen: {http: 'http://localhost:3002'}
    open: true

stop:
  - run: docker rm -f quickrun-btc-rpc-explorer
    continueOnError: true
  - run: docker network rm quickrun-btc-rpc-explorer-net
    continueOnError: true
