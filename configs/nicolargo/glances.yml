# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Glances
repository: nicolargo/glances
description: >-
  Glances an Eye on your system. A top/htop alternative for GNU/Linux, BSD, Mac OS and Windows
  operating systems. Starts the official image (nicolargo/glances:latest-full); nothing is
  stored, so stopping the run leaves nothing behind.
docs: 'https://nicolargo.github.io/glances/'

requires:
  - tool: docker
    install: https://docs.docker.com/get-docker/

setup:
  - run: docker network create quickrun-glances-net
    continueOnError: true

tasks:
  - name: glances
    run: docker run --rm --name quickrun-glances --network quickrun-glances-net -p 61208:61208 -e GLANCES_OPT="-w" nicolargo/glances:latest-full
    readyWhen: {http: 'http://localhost:61208'}
    open: true

stop:
  - run: docker rm -f quickrun-glances
    continueOnError: true
  - run: docker network rm quickrun-glances-net
    continueOnError: true
